<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RoadWatcHero</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- Google Maps with Geometry -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB5GbyoapPOyLYJLNo9y85cyorIczEI-WU&libraries=geometry"></script>

<style>
:root {
  --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: black;
  --accent: #EE611C; --danger: #EE611C; --success: #22c55e; --warning: #f59e0b;
  --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: -apple-system, system-ui, sans-serif; color: var(--text); background: white; overflow: hidden; }
h3{ text-align: center; }
.view { display: none; width: 100vw; height: 100vh; position: fixed; inset: 0; z-index: 10; background: white; overflow-y: auto; }
.view-active { display: flex; flex-direction: column; }

#landingPage { align-items: center; justify-content: center; padding: 30px; text-align: center; z-index: 100; background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%); }
#landingPage img { width: 240px; margin-bottom: 10px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1)); }
.mode-btn { width: 100%; max-width: 320px; padding: 20px; border-radius: 18px; font-size: 18px; font-weight: 700; border: none; cursor: pointer; margin-bottom: 16px; box-shadow: var(--shadow); }
.mode-btn:active { transform: scale(0.98); }
.btn-req { background: var(--danger); color: white; }
.btn-hero { background: var(--text); color: white; }

#seekerUI { background: var(--bg); padding: 20px; align-items: center; }
.status-card { background: white; width: 100%; max-width: 450px; padding: 25px; border-radius: 28px; box-shadow: var(--shadow); text-align: center; margin-top: 10px; border: 1px solid rgba(226, 232, 240, 0.8); }

#seekerMapContainer { position: relative; width: 100%; height: 220px; border-radius: 20px; margin: 15px 0; background: #eee; border: 1px solid #e2e8f0; overflow: hidden; }
#seekerMapContainer.expanded { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1001; border-radius: 0; margin: 0; }
#seekerMap { width: 100%; height: 100%; }

.map-expand-btn { position: absolute; bottom: 10px; right: 10px; background: white; border: none; padding: 8px 12px; border-radius: 15px; box-shadow: var(--shadow); cursor: pointer; z-index: 2; font-weight: 700; }
.map-close-btn { position: absolute; top: 15px; right: 15px; background: var(--danger); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 1002; }

.search-pulse { width: 80px; height: 80px; background: var(--danger); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; margin: 0 auto 20px; position: relative; }
.search-pulse::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--danger); opacity: 0.4; animation: pulse 2s infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(2.5); opacity: 0; } }

#map { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }
#statusIndicator { position: fixed; left: 10px; bottom: 80px; z-index: 150; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 28px; cursor: pointer; box-shadow: var(--shadow); border: 3px solid white; transition: 0.3s; }

#heroPanel { width:100%; max-width: 400px; position: fixed; bottom: 145px; left: 0; z-index: 100; display: flex; flex-direction: column; padding: 0 15px; pointer-events: none; }
#heroPanel > * { pointer-events: auto; }

.task-card { background: white; padding: 20px; border-radius: 24px; box-shadow: var(--shadow); border-left: 6px solid var(--accent); display: none; transform: translateX(-110%); transition: 0.4s; max-height: 400px; overflow-y: auto; }
.task-card.expanded { display: block; transform: translateX(0); }

.sos-list-item { padding: 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }

.modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
.modal-content { background: white; width: 100%; max-width: 500px; border-radius: 32px 32px 0 0; padding: 30px; max-height: 95vh; overflow-y: auto; }

#chatBox { height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 15px; background: #f8fafc; border-radius: 20px; margin-bottom: 12px; }
.msg { padding: 12px 16px; border-radius: 18px; max-width: 80%; }
.msg-me { align-self: flex-end; background: var(--accent); color: white; }
.msg-them { align-self: flex-start; background: white; border: 1px solid #e2e8f0; }

.vehicle-grid { display: flex; gap: 5px; margin: 15px 0; }
.v-type { padding: 10px; border: 2px solid #f1f5f9; border-radius: 10px; text-align: center; cursor: pointer; flex: 1; font-weight: 700; font-size: 12px; }
.v-type.active { border-color: var(--accent); color: var(--accent); }
.tip-btn { border: 2px solid #f1f5f9; border-radius: 10px; padding: 12px; flex: 1; text-align: center; cursor: pointer; font-weight: 800; background: white; }
.tip-btn.active { border-color: var(--success); color: var(--success); }

input, textarea, select { width: 100%; padding: 15px; border-radius: 14px; border: 1px solid #e2e8f0; margin-bottom: 12px; font-size: 15px; }
.submit-btn { width: 100%; padding: 18px; background: var(--accent); color: white; border: none; border-radius: 16px; font-weight: 700; cursor: pointer; }
.cancel-link { display: block; text-align: center; padding: 15px; color: red; cursor: pointer; font-weight: 600; }

.footer { position: fixed; bottom: 0; width: 100%; background: var(--accent); height: 70px; display: flex; justify-content: center; align-items: center; z-index: 200; }
.footer-icons { display: flex; gap: 60px; }
.icon-btn { cursor: pointer; width: 30px; height: 30px; filter: brightness(0) invert(1); }

#imageEnlargeModal { background: rgba(0, 0, 0, 0.9); display: none; align-items: center; justify-content: center; z-index: 2000; }
#imageEnlargeModal img { max-width: 95vw; max-height: 95vh; object-fit: contain; }
#imageEnlargeModal .close-btn { position: absolute; top: 20px; right: 20px; background: white; border-radius: 50%; width: 40px; height: 40px; border: none; font-size: 20px; cursor: pointer; }

.btn-towtruck { background: white; color: #2563eb; border: 2px solid #2563eb; border-radius: 16px; font-weight: 700; padding: 15px; width: 100%; margin-bottom: 10px; cursor: pointer; }
.btn-towtruck.active { background: #2563eb; color: white; }
</style>
</head>
<body>

<div id="landingPage" class="view view-active">
    <img src="roadwatchlogo.png" alt="Logo">
    <h2 style="color: var(--muted); margin-bottom: 40px; font-weight: 500;">Help is just a click away.</h2>
    <button class="mode-btn btn-req" onclick="window.openModal('requestModal')">Find a Hero!</button>
    <button class="mode-btn btn-hero" onclick="window.enterHeroMode()">Become a Hero!</button>
</div>

<div id="seekerUI" class="view">
    <button id="cancelSosBtn" onclick="window.openModal('cancelConfirmModal')" style="background: none; border: none; font-weight: 800; color: var(--danger); padding: 20px; display: none;">✕ CANCEL SOS</button>
    
    <div id="searchingState" class="status-card" style="display:none;">
        <div class="search-pulse">📡</div>
        <h3>Broadcasting SOS...</h3>
        <p>Your request is live. Waiting for a Hero...</p>
    </div>

    <div id="matchedState" class="status-card" style="display:none; border-color: var(--success);">
        <div style="background: var(--success); color: white; padding: 6px 16px; border-radius: 20px; display: inline-block; font-size: 12px; font-weight: 800; margin-bottom: 15px;">HERO CONNECTED</div>
        <div style="display: flex; align-items: center; gap: 15px; text-align: left;">
            <img id="matchPic" src="" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #eee;">
            <div style="flex:1">
                <h3 id="matchName" style="margin:0; text-align: left;">Hero</h3>
                <p id="matchETA" style="margin:4px 0; color: var(--success); font-weight: 800; font-size: 14px;">Arriving...</p>
            </div>
        </div>
        <div id="seekerMapContainer">
            <div id="seekerMap" style="width:100%; height:100%;"></div>
            <button class="map-expand-btn" onclick="window.toggleSeekerMapExpansion()">Expand</button>
            <button class="map-close-btn" onclick="window.toggleSeekerMapExpansion()">✕</button>
        </div>
    </div>

    <div id="completionConfirmState" class="status-card" style="display:none;">
        <div style="font-size: 40px;">✅</div>
        <h3>Job Completed!</h3>
        <button class="submit-btn" style="background: var(--success);" onclick="window.finalSeekerConfirm()">FINISH</button>
    </div>

    <div class="footer"><div class="footer-icons"><img src="Chaticon.png" class="icon-btn" onclick="window.openChat()"></div></div>
</div>

<div id="heroUI" class="view">
    <button class="center-btn" onclick="window.centerOnMe()">RE-CENTER</button>
    <div id="statusIndicator" style="background: #94a3b8;" onclick="window.toggleTaskCard()">!</div>
    <div id="map"></div>
    <div id="heroPanel"><div id="activeTask" class="task-card"></div></div>
    <div class="footer">
        <div class="footer-icons">
            <img src="Historyicon.png" class="icon-btn" onclick="window.openModal('notifModal')">
            <img src="thishomeicon.png" class="icon-btn" onclick="location.reload()">
            <img src="usericon.png" class="icon-btn" onclick="window.openProfile()">
        </div>
    </div>
</div>

<!-- MODALS -->
<div id="detailsModal" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--accent);">SOS DETAILS</h3>
        <img id="detImg" style="width:100%; height:180px; object-fit:cover; border-radius:15px; display:none; margin-bottom:10px;">
        <p id="detIssue" style="font-weight:bold;"></p>
        <p id="detDist" style="color:var(--accent); font-weight:600;"></p>
        <select id="detETA"><option value="5-10 mins">5-10 mins</option><option value="15-20 mins">15-20 mins</option></select>
        <button id="detAcceptBtn" class="submit-btn" style="margin-top:15px;">ACCEPT & HELP</button>
        <span class="cancel-link" onclick="window.closeModal('detailsModal')">Go Back</span>
    </div>
</div>

<div id="requestModal" class="modal">
    <div class="modal-content">
        <h3>Request Hero</h3>
        <div class="vehicle-grid">
            <div class="v-type active" onclick="window.selectVehicle('Car', this)">🚗 Car</div>
            <div class="v-type" onclick="window.selectVehicle('Truck', this)">🛻 Truck</div>
            <div class="v-type" onclick="window.selectVehicle('RV', this)">🚐 RV</div>
        </div>
        <textarea id="reqIssue" placeholder="What's the problem?"></textarea>
        <button id="towTruckBtn" class="btn-towtruck" onclick="window.toggleTowTruckRequest(this)">I NEED A TOW TRUCK!</button>
        <div id="towTruckContact" style="display:none;">
            <input type="tel" id="phoneNumberInput" placeholder="Phone Number">
            <input type="text" id="towDestinationInput" placeholder="Destination">
        </div>
        <button class="submit-btn" onclick="window.submitSOS()">FIND HERO</button>
        <p onclick="window.closeModal('requestModal')" class="cancel-link">Cancel</p>
    </div>
</div>

<div id="notifModal" class="modal"><div class="modal-content"><h3>History</h3><div id="notifHistory"></div><button class="submit-btn" onclick="window.closeModal('notifModal')">Close</button></div></div>

<div id="profileModal" class="modal">
    <div class="modal-content">
        <h3>Profile</h3>
        <input id="profileName" placeholder="Name">
        <label>Radius: <span id="radiusVal">25</span> miles</label>
        <input type="range" id="profileRadius" min="5" max="100" value="25" oninput="document.getElementById('radiusVal').innerText=this.value">
        <button class="submit-btn" onclick="window.saveProfile()">Save</button>
        <span class="cancel-link" onclick="window.closeModal('profileModal')">Close</span>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, push, onValue, get, update, remove } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgXWZkH0WMjhGmOfxjqbIDoJHlyA1pc-o",
  authDomain: "roadsidehero-104ea.firebaseapp.com",
  databaseURL: "https://roadsidehero-104ea-default-rtdb.firebaseio.com",
  projectId: "roadsidehero-104ea",
  storageBucket: "roadsidehero-104ea.firebaseapp.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

if(!localStorage.getItem('heroUserId')) localStorage.setItem('heroUserId', 'u_' + Math.random().toString(36).substr(2, 9));
const myId = localStorage.getItem('heroUserId');

let map, seekerMiniMap, userLocation, selectedVehicle = "Car", myRadius = 25;
let sosCache = {}, profilesCache = {}, markers = {}, isTowTruckRequestActive = false;
let towTruckAnimationInterval = null, currentTowTruckIconState = 0;

// --- Global Functions ---
window.openModal = (id) => document.getElementById(id).style.display = "flex";
window.closeModal = (id) => document.getElementById(id).style.display = "none";

window.toggleTaskCard = () => {
    const card = document.getElementById('activeTask');
    card.classList.toggle('expanded');
};

window.viewRequest = (id) => {
    const r = sosCache[id];
    if(!r) return;
    document.getElementById('detIssue').innerText = r.issue;
    const dist = (google.maps.geometry.spherical.computeDistanceBetween(new google.maps.LatLng(userLocation.lat, userLocation.lng), new google.maps.LatLng(r.lat, r.lng)) / 1609).toFixed(1);
    document.getElementById('detDist').innerText = dist + " miles away";
    document.getElementById('detAcceptBtn').onclick = () => window.confirmHelp(id);
    window.openModal('detailsModal');
};

window.confirmHelp = (id) => {
    const eta = document.getElementById('detETA').value;
    update(ref(db, `sosRequests/${id}`), { status: 'accepted', helperId: myId, eta: eta });
    window.closeModal('detailsModal');
    document.getElementById('activeTask').classList.add('expanded');
};

window.markArrived = () => {
    const active = Object.entries(sosCache).find(([id, r]) => r.helperId === myId && r.status === 'accepted');
    if(active) update(ref(db, `sosRequests/${active[0]}`), { status: 'arrived' });
};

window.completeTask = () => {
    const active = Object.entries(sosCache).find(([id, r]) => r.helperId === myId && r.status === 'arrived');
    if(active) update(ref(db, `sosRequests/${active[0]}`), { status: 'completed' });
};

window.submitSOS = () => {
    const issue = document.getElementById('reqIssue').value;
    if(!issue || !userLocation) return alert("Missing info");
    push(ref(db, "sosRequests"), {
        ownerId: myId, issue, vehicle: selectedVehicle,
        lat: userLocation.lat, lng: userLocation.lng,
        status: 'open', timestamp: Date.now(),
        isTowTruckRequest: isTowTruckRequestActive,
        phoneNumber: document.getElementById('phoneNumberInput').value,
        towDestination: document.getElementById('towDestinationInput').value
    });
    window.closeModal('requestModal');
};

// --- Core Logic ---
window.onload = () => {
    navigator.geolocation.watchPosition(p => {
        userLocation = { lat: p.coords.latitude, lng: p.coords.longitude };
        update(ref(db, `profiles/${myId}`), { ...userLocation, id: myId });
        syncUI();
    });
};

function syncUI() {
    if (!userLocation || typeof google === 'undefined' || !google.maps.geometry) return;

    let nearbyCount = 0;
    let currentTask = null;
    let myActiveSOS = null;
    let hasTowTruck = false;

    Object.entries(sosCache).forEach(([id, r]) => {
        const dist = (google.maps.geometry.spherical.computeDistanceBetween(new google.maps.LatLng(userLocation.lat, userLocation.lng), new google.maps.LatLng(r.lat, r.lng)) / 1609.34);
        
        if (r.ownerId === myId && ['open', 'accepted', 'arrived', 'completed'].includes(r.status)) myActiveSOS = r;

        if (r.status === 'open' && r.ownerId !== myId) {
            if (r.isTowTruckRequest) hasTowTruck = true;
            if (dist <= myRadius) nearbyCount++;
            
            if (map) {
                if (!markers[id]) {
                    const marker = new google.maps.Marker({ position: {lat: r.lat, lng: r.lng}, map });
                    marker.addListener('click', () => window.viewRequest(id));
                    markers[id] = marker;
                }
                const icon = r.isTowTruckRequest ? getTowTruckIcon(currentTowTruckIconState) : getNormalIcon();
                markers[id].setIcon(icon);
            }
        } else if (markers[id]) {
            markers[id].setMap(null);
            delete markers[id];
        }

        if (r.helperId === myId && ['accepted', 'arrived'].includes(r.status)) currentTask = r;
    });

    // Color Indicator logic
    const ind = document.getElementById('statusIndicator');
    if (currentTask) ind.style.background = "#22c55e"; // Green for active job
    else if (nearbyCount > 0) ind.style.background = "#EE611C"; // Orange for nearby
    else ind.style.background = "#94a3b8"; // Grey for quiet

    // Task Card Content
    const tCard = document.getElementById('activeTask');
    if (currentTask) {
        tCard.style.display = 'block';
        tCard.innerHTML = `<b>ACTIVE JOB</b><p>${currentTask.issue}</p>
        <button class="submit-btn" onclick="window.${currentTask.status === 'accepted' ? 'markArrived' : 'completeTask'}()">${currentTask.status === 'accepted' ? 'I HAVE ARRIVED' : 'JOB FINISHED'}</button>`;
    } else if (nearbyCount > 0) {
        tCard.style.display = 'block';
        tCard.innerHTML = `<b>${nearbyCount} SOS NEARBY</b><p>Click markers on map to view details.</p>`;
    } else {
        tCard.style.display = 'none';
        tCard.classList.remove('expanded');
    }

    // Seeker View Persistence
    if (myActiveSOS) {
        if (!document.getElementById('seekerUI').classList.contains('view-active')) window.switchView('seekerUI');
        document.getElementById('searchingState').style.display = myActiveSOS.status === 'open' ? 'block' : 'none';
        document.getElementById('matchedState').style.display = ['accepted', 'arrived'].includes(myActiveSOS.status) ? 'block' : 'none';
        document.getElementById('completionConfirmState').style.display = myActiveSOS.status === 'completed' ? 'block' : 'none';
        if (['accepted', 'arrived'].includes(myActiveSOS.status)) {
            const hero = profilesCache[myActiveSOS.helperId] || {};
            document.getElementById('matchName').innerText = hero.name || "Hero";
            document.getElementById('matchPic').src = hero.pic || "usericon.png";
            document.getElementById('matchETA').innerText = myActiveSOS.status === 'arrived' ? "Hero is here!" : "ETA: " + myActiveSOS.eta;
            updateSeekerMap(myActiveSOS, hero);
        }
    }

    if (hasTowTruck && !towTruckAnimationInterval) startAnimation();
    if (!hasTowTruck && towTruckAnimationInterval) stopAnimation();
}

function getNormalIcon() {
    return { path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW, scale: 5, fillColor: "#EE611C", fillOpacity: 1, strokeColor: "white", strokeWeight: 2 };
}

function getTowTruckIcon(state) {
    const colors = state ? ["#ef4444", "#2563eb"] : ["#2563eb", "#ef4444"];
    return {
        url: 'data:image/svg+xml;utf-8,' + encodeURIComponent(`<svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><circle cx="15" cy="15" r="12" fill="${colors[0]}" stroke="white" stroke-width="2"/><path d="M15 3 A12 12 0 0 1 15 27" fill="${colors[1]}"/></svg>`),
        scaledSize: new google.maps.Size(30, 30), anchor: new google.maps.Point(15, 15)
    };
}

function startAnimation() {
    towTruckAnimationInterval = setInterval(() => {
        currentTowTruckIconState = 1 - currentTowTruckIconState;
        syncUI();
    }, 500);
}

function stopAnimation() { clearInterval(towTruckAnimationInterval); towTruckAnimationInterval = null; }

window.enterHeroMode = () => {
    window.switchView('heroUI');
    if (!map) map = new google.maps.Map(document.getElementById("map"), { center: userLocation, zoom: 14, disableDefaultUI: true });
};

window.switchView = (id) => {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('view-active'));
    document.getElementById(id).classList.add('view-active');
};

onValue(ref(db, "sosRequests"), s => { sosCache = s.val() || {}; syncUI(); });
onValue(ref(db, "profiles"), s => { profilesCache = s.val() || {}; syncUI(); });

</script>
</body>
</html>
