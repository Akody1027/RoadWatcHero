<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Invaders - Touch Edition</title>
    <style>
        body {
            background-color: #202028;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; 
            touch-action: none; /* Disables browser zooming/scrolling on mobile */
        }
        
        canvas {
            background-color: #000000;
            border: 4px solid #33ff00;
            box-shadow: 0 0 20px rgba(51, 255, 0, 0.2);
            /* Make canvas responsive for mobile */
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // --- CONFIGURATION ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 600;

        // --- GAME STATE VARIABLES ---
        let gameActive = true;
        let score = 0;
        let didWin = false;

        // Input State
        const keys = {
            ArrowRight: false,
            ArrowLeft: false,
            Space: false,
            Enter: false
        };

        // --- OBJECTS ---
        const player = {
            x: GAME_WIDTH / 2 - 25,
            y: GAME_HEIGHT - 50,
            width: 50,
            height: 30,
            color: '#33ff00', 
            speed: 6,
            lastShotTime: 0,
            shootDelay: 300 
        };

        let bullets = [];
        let enemies = [];
        const enemyConfig = {
            rows: 5,
            cols: 10,
            width: 40,
            height: 30,
            padding: 15,
            startX: 50,
            startY: 50,
            speed: 2, 
            dropHeight: 20 
        };

        let enemyDirection = 1; 

        // --- INITIALIZATION ---
        function initGame() {
            score = 0;
            gameActive = true;
            didWin = false;
            bullets = [];
            enemies = [];
            player.x = GAME_WIDTH / 2 - 25;
            enemyDirection = 1;

            for (let row = 0; row < enemyConfig.rows; row++) {
                for (let col = 0; col < enemyConfig.cols; col++) {
                    enemies.push({
                        x: enemyConfig.startX + col * (enemyConfig.width + enemyConfig.padding),
                        y: enemyConfig.startY + row * (enemyConfig.height + enemyConfig.padding),
                        width: enemyConfig.width,
                        height: enemyConfig.height,
                        color: '#ff3333'
                    });
                }
            }
        }

        // --- INPUT HANDLING (KEYBOARD) ---
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'Space') keys.Space = true;
            if (e.code === 'Enter') restartGame();
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'Space') keys.Space = false;
        });

        // --- INPUT HANDLING (TOUCHSCREEN) ---
        // 1. Handle shooting and restarting on tap
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Stop screen from scrolling
            if (!gameActive) {
                restartGame();
            } else {
                // Determine touch X position relative to canvas scaling
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const touchX = (e.touches[0].clientX - rect.left) * scaleX;
                
                // Move player immediately to touch
                player.x = touchX - player.width / 2;
                keys.Space = true; // Trigger shot
            }
        }, { passive: false });

        // 2. Handle dragging to move
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            if (gameActive) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const touchX = (e.touches[0].clientX - rect.left) * scaleX;

                // Update player X to follow finger
                player.x = touchX - player.width / 2;
            }
        }, { passive: false });

        // 3. Stop shooting when finger lifts
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys.Space = false;
        });

        function restartGame() {
            if (!gameActive) {
                initGame();
            }
        }

        // --- UPDATE LOGIC ---
        function update() {
            if (!gameActive) return;

            // 1. Player Movement (Keyboard fallback)
            // We only use keyboard math if NOT using touch (touch updates x directly)
            if (keys.ArrowRight && player.x + player.width < GAME_WIDTH) {
                player.x += player.speed;
            }
            if (keys.ArrowLeft && player.x > 0) {
                player.x -= player.speed;
            }

            // Boundary Check (Keep player inside screen)
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > GAME_WIDTH) player.x = GAME_WIDTH - player.width;

            // 2. Shooting Logic
            const currentTime = Date.now();
            if (keys.Space && currentTime - player.lastShotTime > player.shootDelay) {
                bullets.push({
                    x: player.x + player.width / 2 - 2.5, 
                    y: player.y,
                    width: 5,
                    height: 15,
                    color: '#ffff00', 
                    speed: 7
                });
                player.lastShotTime = currentTime;
            }

            // 3. Bullet Physics
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(i, 1);
            }

            // 4. Enemy Movement logic
            let hitWall = false;
            enemies.forEach(enemy => {
                enemy.x += enemyConfig.speed * enemyDirection;
                if (enemy.x + enemy.width > GAME_WIDTH || enemy.x < 0) hitWall = true;
            });

            if (hitWall) {
                enemyDirection *= -1; 
                enemies.forEach(enemy => {
                    enemy.y += enemyConfig.dropHeight; 
                });
            }

            // 5. Collision Detection
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                let bulletHit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (
                        b.x < e.x + e.width &&
                        b.x + b.width > e.x &&
                        b.y < e.y + e.height &&
                        b.y + b.height > e.y
                    ) {
                        enemies.splice(j, 1);
                        bulletHit = true;
                        score += 100;
                        break; 
                    }
                }
                if (bulletHit) bullets.splice(i, 1);
            }

            // 6. Game Over Checks
            if (enemies.length === 0) {
                gameActive = false;
                didWin = true;
            }
            enemies.forEach(enemy => {
                if (enemy.y + enemy.height > player.y) {
                    gameActive = false;
                    didWin = false;
                }
            });
        }

        // --- DRAWING ---
        function draw() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
            });

            ctx.fillStyle = 'white';
            ctx.font = '20px Courier New';
            ctx.fillText('Score: ' + score, 10, 30);

            if (!gameActive) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                ctx.fillStyle = didWin ? '#33ff00' : 'red';
                ctx.font = '50px Courier New';
                ctx.textAlign = 'center';
                
                if (didWin) {
                    ctx.fillText('YOU WIN!', GAME_WIDTH / 2, GAME_HEIGHT / 2);
                } else {
                    ctx.fillText('GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2);
                }

                ctx.fillStyle = 'white';
                ctx.font = '24px Courier New';
                ctx.fillText('Tap Screen to Restart', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 50);
                
                ctx.textAlign = 'left'; 
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initGame();
        gameLoop();

    </script>
</body>
</html>
