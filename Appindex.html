<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ROADWATCHERO</title>
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="apple-touch-icon"
      href="https://www.roadwatchero.com/icon-192x192.png"
    />
    <link rel="icon" href="/roadwatch.ico" type="image/x-icon" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#EE611C" /> 
    <script>
      (function () {
        const minWidth = 450;
        if (window.screen.width < minWidth) {
          const scale = window.screen.width / minWidth;
          const meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content = `width=${minWidth}, initial-scale=${scale}, maximum-scale=${scale}, user-scalable=no`;
          document.head.appendChild(meta);
        } else {
          const meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content =
            "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no";
          document.head.appendChild(meta);
        }
      })();
    </script>

    <style>
      :root {
        --accent: #ee611c;
        --bg: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
      }

 body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        font-family: -apple-system, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      iframe {
        width: 100vw;
        height: 100%;
        height: -webkit-fill-available;
        border: none;
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #coverPage {
        position: fixed;
        inset: 0;
        background: white;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 60px 20px;
        overflow-y: auto;
        text-align: center;
      }

      .logo {
        width: 220px;
        margin-bottom: 40px;
      }

      #browserSection {
        width: 100%;
        max-width: 400px;
        display: block;
      }

      h1 {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 10px;
      }
      .description {
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 25px;
        font-size: 15px;
      }

      .legal-dropdown {
        width: 100%;
        margin-bottom: 20px;
        border: 2px solid #f1f5f9;
        border-radius: 14px;
        background: #fff;
        text-align: left;
        overflow: hidden;
      }
      .legal-header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        font-weight: 800;
        font-size: 13px;
        color: var(--accent);
        background: #fff9f6;
      }
      #legalContent {
        overflow: hidden;
        max-height: 0;
        opacity: 0;
        transition: max-height 0.4s ease, opacity 0.3s ease;
        font-size: 13px;
        padding: 0 18px;
        line-height: 1.6;
      }
      .legal-dropdown.open #legalContent {
        max-height: 300px;
        opacity: 1;
        padding: 18px;
      }

      .tos-check {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
        text-align: left;
        opacity: 0.3;
        pointer-events: none;
        transition: 0.3s;
      }
      .tos-check.unlocked {
        opacity: 1;
        pointer-events: auto;
      }
      .tos-check input {
        width: 26px;
        height: 26px;
        accent-color: var(--accent);
      }

      .proceed-btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 20px;
        border-radius: 18px;
        font-weight: 800;
        font-size: 18px;
        width: 100%;
        cursor: pointer;
        transition: 0.3s;
        text-transform: uppercase;
      }
      .browser-only-btn {
        opacity: 0.3;
        pointer-events: none;
      }
      .browser-only-btn.ready {
        opacity: 1;
        pointer-events: auto;
      }

      #successPrompt {
        display: none;
        flex-direction: column;
        align-items: center;
      }
      #successPrompt h2 {
        color: var(--text);
        font-weight: 800;
        margin-bottom: 10px;
      }

      /* Reset link styling */
      .reset-link {
        margin-top: 40px;
        font-size: 20px;
        color: #cbd5e1;
        cursor: pointer;
        text-decoration: underline;
        background: none;
        border: none;
      }

      /* 1. Sidebar - Vertical Bar on the Left */
      #heroHubSidebar {
        pointer-events: auto; /* Made clickable */
        position: fixed;
        left: 0;
        top: 0;
        width: 50px;
        height: 100%;
        background: var(--accent); /* orange accent*/
        z-index: 1000;
        display: flex; /* Hidden until enterApp() is called */
        flex-direction: column;
        align-items: center;
        padding-top: 20px;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1); /* Animate the slide */
      }

      #heroHubSidebar.open {
        left: calc(100vw - 60px); /* Slides all the way to the right edge */
      }

      .hub-user-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        background: #cbd5e1;
        position: relative;
        cursor: pointer;
      }

      .hub-badge {
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        background: #ef4444;
        color: white;
        font-size: 10px;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 10px;
        border: 2px solid #1e293b;
      }

      .hub-vertical-title {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        color: white;
        font-weight: 800;
        letter-spacing: 2px;
        margin-top: 40px;
        opacity: 0.8;
        font-size: 22px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      #hubToggleBtn {
        margin-top: auto;
        margin-bottom: 150px;
        background: none;
        border: none;
        color: white;
        font-size: 50px;
        cursor: pointer;
        transition: transform 0.4s ease;
      }

      /* 2. The Hub Board - 95% Expansion Drawer */
      #heroHubBoard {
        pointer-events: auto; /* Allows you to click inside the iframe */
        position: fixed;
        left: -95vw; /* Start off-screen */
        top: 0;
        width: 90vw;
        height: 100%;
        background: white;
        z-index: 999;
        transition: left 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.2);
      }

      @media screen and (min-width: 480px) {
        #heroHubBoard {
          width: 90vw;
        }
      }

      #heroHubBoard.open {
        left: 0; /* Slides into the space left by the sidebar */
      }

#appFrame {
        width: calc(100vw - 50px);
        height: 100%;
        height: -webkit-fill-available;
        border: none;
        display: block;
        position: absolute;
        top: 0;
        left: 50px;
        z-index: 1;
      }

      #hubIframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        position: relative;
      }

      /* Overlay to close by clicking the remaining 5% */
      #hubOverlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 998;
        display: none;
        backdrop-filter: blur(2px);
      }

      /* --- PRO SHELL MODAL STYLES --- */
      .shell-modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(5px);
        z-index: 100000;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .shell-modal-content {
        background: white;
        width: 90%;
        max-width: 500px;
        max-height: 90vh;
        border-radius: 24px;
        padding: 30px;
        position: relative;
        overflow-y: auto;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }
      .shell-close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: var(--accent);
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-weight: 900;
        color: white;
        cursor: pointer;
      }
      .shell-input {
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        margin-bottom: 15px;
        font-size: 14px;
        background: #f8fafc;
        font-family: inherit;
        box-sizing: border-box;
      }
      .shell-submit-btn {
        width: 100%;
        padding: 18px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 16px;
        font-weight: 800;
        font-size: 16px;
        cursor: pointer;
        text-transform: uppercase;
        margin-bottom: 5%;
      }
      .shell-upsell-link {
        display: block;
        color: var(--accent);
        font-weight: 800;
        font-size: 14px;
        text-decoration: none;
        margin-top: 10px;
      }
      .shell-upsell-link:hover {
        text-decoration: underline;
      }
      .shell-divider {
        border: 0;
        height: 1px;
        background: #e2e8f0;
        margin: 15% 0;
      }

      /* Campaign Manager Cards */
      .shell-mini-post {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 10px;
        text-align: left;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .shell-post-actions button {
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        font-weight: 800;
        font-size: 11px;
        cursor: pointer;
        margin-left: 5px;
        transition: 0.2s;
      }
      .shell-post-actions button:active {
        transform: scale(0.95);
      }
      .btn-edit {
        background: #f1f5f9;
        color: var(--text);
      }
      .btn-delete {
        background: #fee2e2;
        color: #ef4444;
      }

      /* Social Links Builder Styles */
      .social-row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .social-row select {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        font-size: 13px;
        font-family: inherit;
      }
      .social-row input {
        flex: 2;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        font-size: 13px;
        font-family: inherit;
      }
      .social-row button {
        background: #fee2e2;
        color: #ef4444;
        border: none;
        border-radius: 8px;
        padding: 0 12px;
        font-weight: 900;
        cursor: pointer;
        transition: 0.2s;
      }
      .social-row button:active {
        transform: scale(0.95);
      }

      /* Circular Logo Uploader */
      .logo-uploader-wrapper {
        display: flex;
        justify-content: center;
        margin: 15px 0 25px 0;
      }
      .logo-circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: #f1f5f9;
        border: 2px dashed #cbd5e1;
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        background-size: cover;
        background-position: center;
        transition: 0.3s;
      }
      .logo-circle:hover {
        border-color: var(--accent);
      }
      .logo-plus-badge {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 28px;
        height: 28px;
        background: var(--accent);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 18px;
        border: 3px solid white;
      }
      .logo-hidden-input {
        display: none;
      }

      /* Live Preview Card */

      /* Rectangular Promo Uploader */
      .promo-uploader-wrapper {
        width: 100%;
        margin-top: 5px;
        margin-bottom: 15px;
      }
      .promo-rectangle {
        width: 100%;
        height: 120px;
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--muted);
        font-weight: 800;
        font-size: 13px;
        transition: 0.3s;
        background-size: cover;
        background-position: center;
      }
      .promo-rectangle:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .promo-hidden-input {
        display: none;
      }

      .preview-wrapper {
        margin: 20px 0;
        padding: 15px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        transform: scale(0.9);
        transform-origin: top center;
        pointer-events: none;
      }
      .preview-label {
        text-align: center;
        font-size: 11px;
        font-weight: 900;
        color: var(--accent);
        margin-bottom: 10px;
        letter-spacing: 1px;
      }
      .post-card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        text-align: left;
      }
      .post-header {
        display: flex;
        align-items: center;
        padding: 15px;
        border-bottom: 1px solid #f8fafc;
      }
      .post-user-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #e2e8f0;
        border: 2px solid var(--accent);
        flex-shrink: 0;
        object-fit: cover;
      }
      .post-biz-name {
        flex: 1;
        text-align: center;
        font-weight: 900;
        font-size: 15px;
        color: var(--text);
        padding-right: 36px;
      }
      .post-image-square {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .post-image-square img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .post-footer {
        padding: 15px;
      }
      .post-desc {
        font-size: 14px;
        color: var(--muted);
        margin-top: 0;
        margin-bottom: 15px;
        line-height: 1.4;
        word-wrap: break-word;
      }
      .post-btn {
        width: 100%;
        padding: 14px;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 800;
        font-size: 14px;
        text-transform: uppercase;
      }
    </style>
  </head>











    
    <iframe src="home.html" id="appFrame"></iframe>

    <div id="heroHubSidebar">
      <div class="hub-user-icon" id="sidebarUserIcon">
        <div class="hub-badge" id="hubBadgeCounter">0</div>
      </div>
      <div class="hub-vertical-title">HERO ADVERTISING HUB</div>
      <button id="hubToggleBtn">❯</button>
    </div>

    <div id="hubOverlay"></div>

    <div id="heroHubBoard">
      <iframe src="hub.html" id="hubIframe"></iframe>
    </div>

    <div id="proShellModal" class="shell-modal">
      <div class="shell-modal-content">
        <button
          class="shell-close-btn"
          onclick="document.getElementById('proShellModal').style.display='none'"
        >
          ✕
        </button>

        <div id="shellLoginSection">
          <h2 style="margin-top: 0; font-weight: 900">Pro Hero Login</h2>
          <p style="color: var(--muted); font-size: 14px; margin-bottom: 25px">
            Access your marketing dashboard & fleet dispatch tools.
          </p>
          <input
            type="email"
            id="shellLoginEmail"
            placeholder="Email Address"
            class="shell-input"
          />
          <input
            type="password"
            id="shellLoginPassword"
            placeholder="Password"
            class="shell-input"
          />
          <button id="shellLoginBtn" class="shell-submit-btn">LOGIN</button>

          <div
            style="
              background: #fff9f6;
              border: 2px solid var(--accent);
              border-radius: 16px;
              padding: 20px;
              margin-top: 20px;
            "
          >
            <p style="margin: 0 0 10px 0; font-size: 24px"></p>
            <a
              href="pro-hero.html"
              class="shell-upsell-link"
              style="margin: 0; line-height: 1.4"
              >Advertise with RoadWatcHero<br />Sign up now!</a
            >
          </div>
        </div>

        <div style="text-align: left" id="dashboardFormsContainer">
          <div
            style="
              width: 100%;
              text-align: center;
              color: var(--accent);
              font-size: 20px;
              font-weight: 800;
              margin-bottom: 10%;
            "
            <label
            style="font-size: 20px; font-weight: 800; font: var(--accent)"
          >
            BUSINESS IDENTITY
          </div>

          <div class="logo-uploader-wrapper">
            <label
              for="shellBizLogo"
              class="logo-circle"
              id="logoCirclePreview"
            >
              <div class="logo-plus-badge">+</div>
            </label>
            <input
              type="file"
              id="shellBizLogo"
              accept="image/*"
              class="logo-hidden-input"
            />
          </div>

          <input
            type="text"
            id="shellBizName"
            placeholder="Business Name"
            class="shell-input"
          />
          <input
            type="text"
            id="shellBizAddress"
            placeholder="Business Address (City, State, Zip)"
            class="shell-input"
          />
          <input
            type="tel"
            id="shellBizPhone"
            placeholder="Dispatch Phone Number (For 'Call Now')"
            class="shell-input"
          />

          <button
            id="shellSaveProfileBtn"
            type="button"
            class="shell-submit-btn"
            style="margin-top: 5px; margin-bottom: 5px"
          >
            SAVE
          </button>
          <p
            id="profileSaveMsg"
            style="
              color: #10b981;
              font-size: 12px;
              font-weight: 800;
              display: none;
              text-align: center;
              margin-top: 0;
            "
          >
            ✓ Profile Saved Successfully!
          </p>

          <hr class="shell-divider" />

          <div style="width: 100%; text-align: center">
            <label
              style="font-size: 20px; font-weight: 800; color: var(--accent)"
              >CREATE NEW AD</label
            >
          </div>

          <div class="promo-uploader-wrapper">
            <label
              style="
                font-size: 12px;
                font-weight: 600;
                display: block;
                margin-bottom: 8px;
                margin-top: 5%;
              "
              >Promo Image (Required):</label
            >
            <label
              for="shellPromoImage"
              class="promo-rectangle"
              id="promoRectPreview"
            >
              <span>+ TAP TO UPLOAD PROMO IMAGE</span>
            </label>
            <input
              type="file"
              id="shellPromoImage"
              accept="image/*"
              class="promo-hidden-input"
            />
          </div>

          <select id="shellPostCategory" class="shell-input">
            <option value="Towing">Towing</option>
            <option value="Mechanic">Mechanic</option>
            <option value="Detailing">Detailing</option>
            <option value="Tires">Tires</option>
            <option value="Locksmith">Locksmith</option>
            <option value="Tint">Tint</option>
            <option value="Glass">Glass</option>
            <option value="Battery">Battery</option>
            <option value="Wraps">Wraps</option>
            <option value="Bodywork">Bodywork</option>
            <option value="Audio">Audio</option>
            <option value="Upholstery">Upholstery</option>
            <option value="Alignment">Alignment</option>
            <option value="Oil">Oil</option>
            <option value="Transmission">Transmission</option>
          </select>

          <textarea
            id="shellPostDesc"
            placeholder="Promo Description (e.g. 10% off today!)"
            class="shell-input"
            rows="3"
          ></textarea>

          <div
            style="
              margin-bottom: 15px;
              background: #f8fafc;
              padding: 15px;
              border-radius: 12px;
              border: 1px solid #e2e8f0;
            "
          >
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;
              "
            >
              <label
                style="font-size: 12px; font-weight: 800; color: var(--muted)"
                >SOCIAL LINKS (For this ad)</label
              >
              <button
                id="addSocialBtn"
                type="button"
                style="
                  background: var(--accent);
                  color: white;
                  border: none;
                  border-radius: 6px;
                  font-weight: 900;
                  font-size: 11px;
                  cursor: pointer;
                  padding: 6px 12px;
                "
              >
                + ADD
              </button>
            </div>
            <div id="socialLinksContainer"></div>
          </div>

          <div class="preview-wrapper" id="livePreviewBox">
            <div class="preview-label">LIVE PREVIEW</div>
            <div class="post-card">
              <div class="post-header">
                <img
                  src="https://via.placeholder.com/36"
                  class="post-user-icon"
                  id="previewLogo"
                />
                <div class="post-biz-name" id="previewName">Business Name</div>
              </div>
              <div class="post-image-square">
                <img
                  src="https://via.placeholder.com/500"
                  alt="Promo Ad"
                  id="previewPromo"
                />
              </div>
              <div class="post-footer">
                <p class="post-desc" id="previewDesc">
                  Your promo description will appear here.
                </p>
                <button class="post-btn">CALL NOW</button>
              </div>
            </div>
          </div>

          <button
            id="shellPublishBtn"
            class="shell-submit-btn"
            style="background: #10b981"
          >
            PUBLISH TO HUB
          </button>

        <hr class="shell-divider" />

        <label style="font-size: 20px; font-weight: 800; color: var(--accent)"
          >MANAGE ADVERTISEMENTS</label
        >
        <div id="shellActivePosts" style="margin-top: 10%">
          <p
            style="
              font-size: 13px;
              color: var(--muted);
              text-align: center;
              font-style: italic;
            "
          >
            No active posts yet.
          </p>
        </div>

         <button
          onclick="window.shellSignOut()"
          class="shell-submit-btn"
          style="background: transparent; color: #ef4444; border: 2px solid #ef4444; margin-top: 40px; box-shadow: none;"
        >
          SIGN OUT
        </button>

          
        </div>
    </div>
</div>

   <script>
      function adjustViewport() {
        const width = window.screen.width;
        let scale = 1.0;

        if (width < 450) {
          scale = width / 450; 
        }

        const viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) {
          viewport.setAttribute(
            "content",
            `width=device-width, initial-scale=${scale}, maximum-scale=${scale}, user-scalable=no`
          );
        }
      }

      adjustViewport();
      window.addEventListener("resize", adjustViewport);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("/service-worker.js")
        );
      }

      const hubBoard = document.getElementById("heroHubBoard");
      const hubToggle = document.getElementById("hubToggleBtn");
      const hubOverlay = document.getElementById("hubOverlay");

      function toggleHeroHub() {
        const isOpen = hubBoard.classList.toggle("open");
        const sidebar = document.getElementById("heroHubSidebar");
        sidebar.classList.toggle("open");

        const iframe = document.getElementById("hubIframe");
        if (isOpen && (!iframe.src || iframe.src.includes("about:blank"))) {
          iframe.src = "hub.html";
        }

        hubToggle.style.transform = isOpen ? "rotate(180deg)" : "rotate(0deg)";
        hubOverlay.style.display = isOpen ? "block" : "none";
      }

      hubToggle.addEventListener("click", toggleHeroHub);
      hubOverlay.addEventListener("click", toggleHeroHub);

      function updateHubBadge(count) {
        const badge = document.getElementById("hubBadgeCounter");
        if (badge) {
          badge.innerText = count;
          badge.style.display = count > 0 ? "block" : "none";
        }
      }
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
      import {
        getDatabase,
        ref,
        onValue,
        push,
        update,
        remove,
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

      import {
        getStorage,
        ref as storageRef,
        uploadBytes,
        getDownloadURL,
        deleteObject,
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";

      // Your exact project credentials
      const firebaseConfig = {
        apiKey: "AIzaSyBgXWZkH0WMjhGmOfxjqbIDoJHlyA1pc-o",
        authDomain: "roadsidehero-104ea.firebaseapp.com",
        databaseURL: "https://roadsidehero-104ea-default-rtdb.firebaseio.com",
        projectId: "roadsidehero-104ea",
        storageBucket: "roadsidehero-104ea.firebasestorage.app",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);

      const storage = getStorage(app);
      let allPostsData = {}; // Cache to hold post data for editing

      const socialContainer = document.getElementById("socialLinksContainer");
      window.createSocialRow = (platform = "Website", url = "") => {
        const row = document.createElement("div");
        row.className = "social-row";
        row.innerHTML = `
          <select>
            <option value="Website" ${
              platform === "Website" ? "selected" : ""
            }>Website</option>
            <option value="Facebook" ${
              platform === "Facebook" ? "selected" : ""
            }>Facebook</option>
            <option value="Instagram" ${
              platform === "Instagram" ? "selected" : ""
            }>Instagram</option>
            <option value="TikTok" ${
              platform === "TikTok" ? "selected" : ""
            }>TikTok</option>
            <option value="X" ${platform === "X" ? "selected" : ""}>X</option>
            <option value="Yelp" ${
              platform === "Yelp" ? "selected" : ""
            }>Yelp</option>
          </select>
          <input type="url" placeholder="Paste URL" value="${url}">
          <button type="button" onclick="this.parentElement.remove()">✕</button>
        `;
        socialContainer.appendChild(row);
      };
      document
        .getElementById("addSocialBtn")
        .addEventListener("click", () => window.createSocialRow());

      function getSocialLinks() {
        const links = [];
        socialContainer.querySelectorAll(".social-row").forEach((row) => {
          const platform = row.querySelector("select").value;
          const url = row.querySelector("input").value.trim();
          if (url) links.push({ platform, url });
        });
        return links;
      }

      let currentUserId = null;

      // --- LIVE PREVIEW & UPLOADER UI LOGIC ---
      const updatePreview = () => {
        document.getElementById("previewName").innerText =
          document.getElementById("shellBizName").value || "Business Name";
        document.getElementById("previewDesc").innerText =
          document.getElementById("shellPostDesc").value ||
          "Your promo description will appear here.";
      };
      document
        .getElementById("shellBizName")
        .addEventListener("input", updatePreview);
      document
        .getElementById("shellPostDesc")
        .addEventListener("input", updatePreview);

      // Handle Circular Logo Upload Preview
      document
        .getElementById("shellBizLogo")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              document.getElementById(
                "logoCirclePreview"
              ).style.backgroundImage = `url(${e.target.result})`;
              document
                .getElementById("logoCirclePreview")
                .querySelector(".logo-plus-badge").style.display = "none";
              document.getElementById("previewLogo").src = e.target.result;
            };
            reader.readAsDataURL(file);
          }
        });

      // Handle Promo Image Upload Preview
      document
        .getElementById("shellPromoImage")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              document.getElementById(
                "promoRectPreview"
              ).style.backgroundImage = `url(${e.target.result})`;
              document.getElementById("promoRectPreview").innerHTML = ""; // hide text
              document.getElementById("previewPromo").src = e.target.result;
            };
            reader.readAsDataURL(file);
          }
        });

      // ----------------------------------------

      // 1. Sidebar Icon Click Listener (Opens Gatekeeper)
      document
        .getElementById("sidebarUserIcon")
        .addEventListener("click", () => {
          document.getElementById("proShellModal").style.display = "flex";

          // Reset Lead Analytics Badge when they check their profile
          window.updateHubBadge(0);
          if (currentUserId) {
            update(ref(db, `profiles/${currentUserId}`), { unreadLeads: 0 });
          }
        });

      // 2. Authentication State Listener
      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUserId = user.uid;

// Load Profile Data (Name, Phone, Address, Logo, Leads)
              onValue(ref(db, `profiles/${currentUserId}`), (snap) => {
                const data = snap.val() || {};

                // THE PRO GATEKEEPER: Verify Stripe payment status
                if (data.isPro !== true) {
                  document.getElementById("shellLoginSection").style.display = "block";
                  document.getElementById("dashboardFormsContainer").style.display = "none";
                  const loginBtn = document.getElementById("shellLoginBtn");
                  if (loginBtn) loginBtn.innerText = "PRO SUBSCRIPTION REQUIRED";
                  return; // Stop execution, keep dashboard hidden!
                }

                // If they are a verified Pro, unlock the dashboard
                document.getElementById("shellLoginSection").style.display = "none";
                document.getElementById("dashboardFormsContainer").style.display = "block";

      



            

            // Auto-fill core identity using a session flag to beat browser cache
            if (!document.getElementById("shellBizName").dataset.loaded) {
              document.getElementById("shellBizName").value =
                data.companyName || data.name || "";
              document.getElementById("shellBizPhone").value =
                data.dispatchPhone || "";
              document.getElementById("shellBizAddress").value =
                data.businessAddress || "";

              // Lock the fields so real-time lead updates don't erase user typing later
              document.getElementById("shellBizName").dataset.loaded = "true";
            }

            // Load saved logo into the Dashboard Circle, Preview, and Sidebar Avatar
            if (data.logoUrl) {
              document.getElementById("shellBizLogo").dataset.existing =
                data.logoUrl;

              document.getElementById(
                "logoCirclePreview"
              ).style.backgroundImage = `url(${data.logoUrl})`;
              document
                .getElementById("logoCirclePreview")
                .querySelector(".logo-plus-badge").style.display = "none";
              document.getElementById("previewLogo").src = data.logoUrl;
              document.getElementById(
                "sidebarUserIcon"
              ).style.backgroundImage = `url(${data.logoUrl})`;
              document.getElementById("sidebarUserIcon").style.backgroundSize =
                "cover";
            }

            // Trigger the live preview text update initially
            document.getElementById("previewName").innerText =
              document.getElementById("shellBizName").value || "Business Name";

            if (
              data.unreadLeads > 0 &&
              document.getElementById("proShellModal").style.display !== "flex"
            ) {
              window.updateHubBadge(data.unreadLeads);
            }
          });

          // Live Listener for Active Campaigns (Bottom of Profile)
          onValue(ref(db, "businessPosts"), (snap) => {
            const posts = snap.val() || {};
            allPostsData = posts;

            // Filter down to ONLY posts owned by this specific Pro
            const myPosts = Object.entries(posts).filter(
              ([id, p]) => p.ownerId === currentUserId
            );
            const container = document.getElementById("shellActivePosts");

            if (myPosts.length === 0) {
              container.innerHTML =
                '<p style="font-size: 13px; color: var(--muted); text-align: center; font-style: italic;">No active posts yet.</p>';
              return;
            }

            container.innerHTML = "";

            myPosts.forEach(([id, post]) => {
              container.innerHTML += `
                    <div class="post-card" style="margin-bottom: 25px; border: 2px solid var(--accent);">
                        <div class="post-header">
                            <img src="${
                              post.logoUrl || "https://via.placeholder.com/36"
                            }" class="post-user-icon">
                            <div class="post-biz-name">${
                              post.businessName || "Business Name"
                            }</div>
                        </div>
                        <div class="post-image-square">
                            <img src="${
                              post.promoUrl ||
                              "https://via.placeholder.com/500?text=PROMO+IMAGE+HERE"
                            }" alt="Promo Ad">
                        </div>
                        <div class="post-footer">
                            <p class="post-desc">${post.description || ""}</p>
                            <div style="display: flex; gap: 10px; margin-top: 15px;">
                                <button class="post-btn" style="background: #f1f5f9; color: var(--text);" onclick="window.editPost('${id}')">EDIT AD</button>
                                <button class="post-btn" style="background: #fee2e2; color: #ef4444;" onclick="window.deletePost('${id}')">DELETE</button>
                            </div>
                        </div>
                    </div>
                 `;
            });
          });
        } else {
          currentUserId = null;


          
          document.getElementById("shellLoginSection").style.display = "block";
          document.getElementById("dashboardFormsContainer").style.display =
            "none";
        }
      });

      // 3. Login Action
      document.getElementById("shellLoginBtn").addEventListener("click", () => {
        const email = document.getElementById("shellLoginEmail").value;
        const pass = document.getElementById("shellLoginPassword").value;
        if (!email || !pass)
          return alert("Please enter your Pro email and password.");

        document.getElementById("shellLoginBtn").innerText = "LOADING...";
        signInWithEmailAndPassword(auth, email, pass)
          .then(() => {
            document.getElementById("shellLoginBtn").innerText = "LOGIN";
          })
          .catch((err) => {
            alert("Login failed. Check your credentials.");
            document.getElementById("shellLoginBtn").innerText = "LOGIN";
          });
      });
      
      
      // --- IMAGE COMPRESSION HELPER ---
      const compressImage = async (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              const MAX_WIDTH = 800; 
              const scaleSize = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
              canvas.width = img.width * scaleSize;
              canvas.height = img.height * scaleSize;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.7);
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      };

      // --- SAVE IDENTITY LOGIC ---
      document
        .getElementById("shellSaveProfileBtn")
        .addEventListener("click", async () => {
          const bizName = document.getElementById("shellBizName").value;
          const address = document.getElementById("shellBizAddress").value;
          const phone = document.getElementById("shellBizPhone").value;
          const logoFile = document.getElementById("shellBizLogo").files[0];

          if (!bizName || !phone || !address) {
            return alert(
              "Please fill out your Business Name, Address, and Phone to save your identity."
            );
          }

          const btn = document.getElementById("shellSaveProfileBtn");
          btn.innerText = "SAVING...";
          btn.style.opacity = "0.7";
          btn.style.pointerEvents = "none";

          let finalLogoUrl = document.getElementById("shellBizLogo").dataset.existing || "";

          try {
            if (logoFile) {
              const compressedLogo = await compressImage(logoFile);
              const sRef = storageRef(
                storage,
                `hub_ads/${currentUserId}/logo_${Date.now()}.jpg`
              );
              await uploadBytes(sRef, compressedLogo);
              finalLogoUrl = await getDownloadURL(sRef);
            }

            await update(ref(db, `profiles/${currentUserId}`), {
              companyName: bizName,
              businessAddress: address,
              dispatchPhone: phone,
              logoUrl: finalLogoUrl,
            });

            document.getElementById("shellBizLogo").dataset.existing = finalLogoUrl;

            btn.innerText = "SAVE";
            btn.style.opacity = "1";
            btn.style.pointerEvents = "auto";
            document.getElementById("profileSaveMsg").style.display = "block";
            setTimeout(
              () => (document.getElementById("profileSaveMsg").style.display = "none"),
              3000
            );
            
            
            
            
            } catch (e) {
            console.error(e);
            alert("System Error: " + e.message);
            btn.innerText = "SAVE";
            btn.style.opacity = "1";
            btn.style.pointerEvents = "auto";
          }

        
        
        
        });

      let editingPostId = null;
      document
        .getElementById("shellPublishBtn")
        .addEventListener("click", async () => {
          const bizName = document.getElementById("shellBizName").value;
          const address = document.getElementById("shellBizAddress").value;
          const phone = document.getElementById("shellBizPhone").value;
          const desc = document.getElementById("shellPostDesc").value;
          const cat = document.getElementById("shellPostCategory").value;
          const logoFile = document.getElementById("shellBizLogo").files[0];
          const promoFile = document.getElementById("shellPromoImage").files[0];

          if (!bizName || !phone || !address || !desc) {
            return alert(
              "Please fill out your Business Name, Address, Phone, and Description."
            );
          }

          const btn = document.getElementById("shellPublishBtn");
          btn.innerText = "UPLOADING...";
          btn.style.opacity = "0.7";
          btn.style.pointerEvents = "none";

          let finalLogoUrl = document.getElementById("shellBizLogo").dataset.existing || "";
          let finalPromoUrl = document.getElementById("shellPromoImage").dataset.existing || "";

          try {
            if (logoFile) {
              const compressedLogo = await compressImage(logoFile);
              const sRef = storageRef(
                storage,
                `hub_ads/${currentUserId}/logo_${Date.now()}.jpg`
              );
              await uploadBytes(sRef, compressedLogo);
              finalLogoUrl = await getDownloadURL(sRef);
            }
            if (promoFile) {
              const compressedPromo = await compressImage(promoFile);
              const sRef = storageRef(
                storage,
                `hub_ads/${currentUserId}/promo_${Date.now()}.jpg`
              );
              await uploadBytes(sRef, compressedPromo);
              finalPromoUrl = await getDownloadURL(sRef);
            }

            await update(ref(db, `profiles/${currentUserId}`), {
              companyName: bizName,
              businessAddress: address,
              dispatchPhone: phone,
              logoUrl: finalLogoUrl,
            });

            const postData = {
              ownerId: currentUserId,
              businessName: bizName,
              address: address,
              phone: phone,
              description: desc,
              category: cat,
              logoUrl: finalLogoUrl,
              promoUrl: finalPromoUrl,
              socialLinks: getSocialLinks(),
              timestamp: Date.now(),
            };

            if (editingPostId) {
              await update(ref(db, `businessPosts/${editingPostId}`), postData);
              editingPostId = null;
            } else {
              await push(ref(db, "businessPosts"), postData);
            }

            document.getElementById("shellPostDesc").value = "";
            document.getElementById("shellPromoImage").value = "";
            document.getElementById("shellPromoImage").dataset.existing = "";

            document.getElementById("promoRectPreview").style.backgroundImage = "none";
            document.getElementById("promoRectPreview").innerHTML = "<span>+ TAP TO UPLOAD PROMO IMAGE</span>";
            document.getElementById("previewPromo").src = "https://via.placeholder.com/500?text=YOUR+PROMO+IMAGE+HERE";
            document.getElementById("previewDesc").innerText = "Your promo description will appear here.";

            socialContainer.innerHTML = "";

            btn.innerText = "PUBLISH TO HUB";
            btn.style.background = "#10b981";
            btn.style.opacity = "1";
            btn.style.pointerEvents = "auto";
          } catch (e) {
            console.error(e);
            alert("Error uploading images.");
            btn.innerText = "PUBLISH TO HUB";
            btn.style.opacity = "1";
            btn.style.pointerEvents = "auto";
          }
        });
      
      

      window.deletePost = async (postId) => {
        if (
          confirm(
            "Are you sure you want to delete this ad? It will be removed from the Hub instantly."
          )
        ) {
          const post = allPostsData[postId];
          if (post) {
            try {
              if (post.logoUrl && post.logoUrl.includes("firebasestorage")) {
                await deleteObject(storageRef(storage, post.logoUrl));
              }
            } catch (e) {}
            try {
              if (post.promoUrl && post.promoUrl.includes("firebasestorage")) {
                await deleteObject(storageRef(storage, post.promoUrl));
              }
            } catch (e) {}
          }
          remove(ref(db, `businessPosts/${postId}`));
        }
      };

      window.editPost = (postId) => {
        const post = allPostsData[postId];
        if (!post) return;

        editingPostId = postId;
        document.getElementById("shellPostDesc").value = post.description || "";
        document.getElementById("shellPostCategory").value =
          post.category || "Towing";

        document.getElementById("shellBizLogo").dataset.existing =
          post.logoUrl || "";
        document.getElementById("shellPromoImage").dataset.existing =
          post.promoUrl || "";
        document.getElementById("shellBizLogo").value = "";
        document.getElementById("shellPromoImage").value = "";

        // Push data to the Live Preview Card

        document.getElementById("promoRectPreview").style.backgroundImage =
          post.promoUrl ? `url(${post.promoUrl})` : "none";
        document.getElementById("promoRectPreview").innerHTML = post.promoUrl
          ? ""
          : "<span>+ TAP TO UPLOAD PROMO IMAGE</span>";
        document.getElementById("previewDesc").innerText =
          post.description || "Your promo description will appear here.";
        document.getElementById("previewPromo").src =
          post.promoUrl ||
          "https://via.placeholder.com/500?text=YOUR+PROMO+IMAGE+HERE";
        if (post.logoUrl)
          document.getElementById("previewLogo").src = post.logoUrl;

        document.getElementById("previewName").innerText =
          post.businessName || "Business Name";

        socialContainer.innerHTML = "";
        if (post.socialLinks) {
          post.socialLinks.forEach((link) =>
            window.createSocialRow(link.platform, link.url)
          );
        }

        const btn = document.getElementById("shellPublishBtn");
        btn.innerText = "UPDATE POST";
        btn.style.background = "var(--text)";

        document.querySelector(".shell-modal-content").scrollTop = 0;
      };



        window.shellSignOut = () => {
        signOut(auth).then(() => {
          document.querySelector(".shell-modal-content").scrollTop = 0;
        }).catch((error) => {
          console.error("Sign out error:", error);
          alert("Error signing out.");
        });
      };


      
    </script>
  </body>
</html>
