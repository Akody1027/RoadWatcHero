<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Hub Module</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <style>
        :root { --accent: #EE611C; --bg: #f4f7f9; --surface: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        /* HEADER & NAV STRIP */
        .hub-module-header { background: var(--surface); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); height: 70px; }
        .logo-box img { height: 40px; width: auto; }
        .hub-title { font-size: 18px; font-weight: 900; color: var(--accent); text-transform: uppercase; }

        .nav-strip { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); height: 60px; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-right: 1px solid var(--border); }
        .nav-item img { width: 28px; height: 28px; object-fit: contain; }

        /* LEFT-SIDE SEARCH MODULE (25% Width) */
        #searchModule { 
            position: absolute; 
            top: 130px; /* Under Header + Nav */
            left: -25%; 
            width: 25%; 
            height: calc(100vh - 130px); 
            background: var(--surface); 
            z-index: 100; 
            border-right: 1px solid var(--border);
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }
        #searchModule.open { left: 0; }

        /* FEED AREA (Adjusts when Sidebar opens) */
        .module-body { 
            height: calc(100vh - 130px); 
            overflow-y: auto; 
            padding: 20px; 
            transition: margin-left 0.4s ease;
        }
        .module-body.shifted { margin-left: 25%; }

        /* BUSINESS POST STRUCTURE (GHOST CARDS) */
        .post-structure { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            margin-bottom: 25px; 
            max-width: 600px; 
            margin-left: auto; 
            margin-right: auto;
            overflow: hidden;
        }
        .post-header { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #f8fafc; }
        .user-icon-circle { width: 35px; height: 35px; border-radius: 50%; background: #e2e8f0; border: 1px solid var(--border); }
        .biz-name-placeholder { flex: 1; text-align: center; font-weight: 800; font-size: 14px; color: var(--muted); text-transform: uppercase; }
        .post-image-square { width: 100%; aspect-ratio: 1 / 1; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-weight: 700; }
        .post-footer { padding: 15px; border-top: 1px solid #f8fafc; }

        /* VERTICAL LIST */
        .cat-row { padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; }
        .cat-row:hover { background: #fff8f5; color: var(--accent); }

        .input-box { width: 90%; margin: 10px auto; display: block; padding: 10px; border: 1px solid var(--border); border-radius: 6px; }
    </style>
</head>
<body>

    <div class="hub-module-header">
        <div class="logo-box"><img src="https://www.roadwatchero.com/assets/logo-placeholder.png" alt="RW Hero"></div>
        <div class="hub-title">Hero Hub</div>
    </div>

    <div class="nav-strip">
        <div class="nav-item" onclick="toggleSearch()"><img src="https://www.roadwatchero.com/assets/nav/search-icon.png" alt="Search"></div>
        <div class="nav-item" onclick="switchView('home')"><img src="https://www.roadwatchero.com/assets/nav/home-icon.png" alt="Home"></div>
        <div class="nav-item" onclick="switchView('profile')"><img src="https://www.roadwatchero.com/assets/nav/user-icon.png" alt="Profile"></div>
    </div>

    <div id="searchModule">
        <div style="padding: 20px;">
            <h3 style="margin-top:0; font-size: 16px;">Filter Results</h3>
            <input type="text" class="input-box" placeholder="City / Address">
            <input type="range" min="5" max="100" value="25" style="width:90%; margin: 10px auto; display:block; accent-color: var(--accent);">
            
            <p style="font-size: 10px; font-weight: 800; color: var(--muted); margin-top: 25px; padding-left: 5px;">CATEGORIES</p>
            <div class="cat-row">Towing Services <span>→</span></div>
            <div class="cat-row">Mobile Mechanic <span>→</span></div>
            <div class="cat-row">Auto Detailing <span>→</span></div>
            <div class="cat-row">Tire Repair <span>→</span></div>
            <div class="cat-row">Auto Locksmith <span>→</span></div>
        </div>
    </div>

    <div id="view-home" class="module-body">
        
        <div style="text-align:center; padding: 20px; color: var(--muted);">
            <h2 style="margin:0; font-size: 18px;">Waiting for Businesses to Post...</h2>
            <p style="font-size: 12px;">This is how the marketplace will appear:</p>
        </div>

        <div class="post-structure">
            <div class="post-header">
                <div class="user-icon-circle"></div>
                <div class="biz-name-placeholder">Business Name Here</div>
            </div>
            <div class="post-image-square">POST IMAGE AREA</div>
            <div class="post-footer">
                <div style="width:100%; height:45px; background: #10b981; border-radius: 8px;"></div>
            </div>
        </div>

        <div class="post-structure" style="opacity: 0.6;">
            <div class="post-header">
                <div class="user-icon-circle"></div>
                <div class="biz-name-placeholder">Business Name Here</div>
            </div>
            <div class="post-image-square">POST IMAGE AREA</div>
            <div class="post-footer">
                <div style="width:100%; height:45px; background: #10b981; border-radius: 8px;"></div>
            </div>
        </div>

    </div>

    <script>
        function toggleSearch() {
            const module = document.getElementById('searchModule');
            const body = document.getElementById('view-home');
            const isOpen = module.classList.toggle('open');
            if(isOpen) {
                body.classList.add('shifted');
            } else {
                body.classList.remove('shifted');
            }
        }

        function switchView(view) {
            // Logic for switching tabs
        }
    </script>
</body>
</html>
