<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Hub Module</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <style>
        :root { --accent: #EE611C; --bg: #f4f7f9; --surface: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        /* HEADER & NAV */
        .hub-module-header { background: var(--surface); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); height: 70px; }
        .logo-box img { height: 40px; width: auto; }
        .hub-title { font-size: 18px; font-weight: 900; color: var(--accent); text-transform: uppercase; }

        .nav-strip { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); height: 60px; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-right: 1px solid var(--border); transition: 0.2s; }
        .nav-item img { width: 28px; height: 28px; }
        .nav-item.active { background: #fff8f5; }

        /* PERMANENT SIDEBAR (40% Default, 25% Collapsed) */
        #searchModule { 
            position: absolute; 
            top: 130px; 
            left: 0; 
            width: 40%; 
            height: calc(100vh - 130px); 
            background: var(--surface); 
            z-index: 100; 
            border-right: 1px solid var(--border);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }
        #searchModule.collapsed { width: 25%; }

        /* FEED AREA - Responsive to Sidebar */
        .module-body { 
            height: calc(100vh - 130px); 
            overflow-y: auto; 
            padding: 20px; 
            margin-left: 40%;
            transition: margin-left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .module-body.expanded-feed { margin-left: 25%; }

        /* CLEAN CATEGORY LIST */
        .cat-row { 
            padding: 14px 20px; 
            border-bottom: 1px solid #f1f5f9; 
            font-size: 13px; 
            font-weight: 700; 
            cursor: pointer; 
            color: var(--text);
            text-transform: capitalize;
        }
        .cat-row:hover { background: #fff8f5; color: var(--accent); }

        /* POST STRUCTURE */
        .post-structure { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 25px; max-width: 500px; margin-left: auto; margin-right: auto; overflow: hidden; }
        .post-header { display: flex; align-items: center; padding: 12px; }
        .user-icon-circle { width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; }
        .biz-name-placeholder { flex: 1; text-align: center; font-weight: 800; font-size: 13px; color: var(--muted); }
        .post-image-square { width: 100%; aspect-ratio: 1 / 1; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #cbd5e1; }
        .post-footer { padding: 12px; }

        .input-label { font-size: 10px; font-weight: 800; color: var(--muted); margin: 15px 20px 5px 20px; text-transform: uppercase; }
        .input-box { width: calc(100% - 40px); margin: 0 auto 15px auto; display: block; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 14px; }
    </style>
</head>
<body>

    <div class="hub-module-header">
        <div class="logo-box"><img src="https://www.roadwatchero.com/assets/logo-placeholder.png" alt="RW Hero"></div>
        <div class="hub-title">Hero Hub</div>
    </div>

    <div class="nav-strip">
        <div class="nav-item" id="searchToggle" onclick="toggleSidebarWidth()"><img src="https://www.roadwatchero.com/assets/nav/search-icon.png" alt="Toggle"></div>
        <div class="nav-item active" onclick="switchView('home')"><img src="https://www.roadwatchero.com/assets/nav/home-icon.png" alt="Home"></div>
        <div class="nav-item" onclick="switchView('profile')"><img src="https://www.roadwatchero.com/assets/nav/user-icon.png" alt="Profile"></div>
    </div>

    <div id="searchModule">
        <div class="input-label">Keywords</div>
        <input type="text" class="input-box" placeholder="Towing, Brakes, etc...">
        
        <div class="input-label">Location</div>
        <input type="text" class="input-box" placeholder="City or Address">
        
        <div class="input-label">Radius (Miles)</div>
        <input type="range" min="5" max="100" value="25" style="width: calc(100% - 40px); margin: 0 20px 20px 20px; accent-color: var(--accent);">
        
        <div class="input-label">Categories</div>
        <div id="categoryList">
            <div class="cat-row">Towing</div>
            <div class="cat-row">Mechanic</div>
            <div class="cat-row">Detailing</div>
            <div class="cat-row">Tires</div>
            <div class="cat-row">Locksmith</div>
            <div class="cat-row">Tint</div>
            <div class="cat-row">Glass</div>
            <div class="cat-row">Battery</div>
            <div class="cat-row">Wraps</div>
            <div class="cat-row">Bodywork</div>
            <div class="cat-row">Audio</div>
            <div class="cat-row">Upholstery</div>
            <div class="cat-row">Alignment</div>
            <div class="cat-row">Oil</div>
            <div class="cat-row">Transmission</div>
        </div>
    </div>

    <div id="view-home" class="module-body">
        <div style="text-align:center; padding-bottom: 20px; color: var(--muted);">
            <h2 style="margin:0; font-size: 16px;">Waiting for Businesses to Post...</h2>
        </div>

        <div class="post-structure">
            <div class="post-header">
                <div class="user-icon-circle"></div>
                <div class="biz-name-placeholder">BUSINESS NAME</div>
            </div>
            <div class="post-image-square">1:1 AD IMAGE</div>
            <div class="post-footer">
                <div style="width:100%; height:45px; background: #10b981; border-radius: 8px;"></div>
            </div>
        </div>
    </div>

    <div id="view-profile" class="module-body" style="display:none; margin-left: 0;">
        <div style="max-width:400px; margin: 40px auto; background:white; padding:30px; border-radius:16px; border:1px solid var(--border); text-align:center;">
            <h2 style="margin-top:0">Pro Portal</h2>
            <input type="email" id="proEmail" class="input-box" style="width:100%" placeholder="Email">
            <input type="password" id="proPass" class="input-box" style="width:100%" placeholder="Password">
            <button onclick="loginPro()" style="width:100%; padding:15px; background:var(--accent); color:white; border:none; border-radius:8px; font-weight:800; cursor:pointer;">LOGIN</button>
        </div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL KEYS FROM HOME.HTML
        const firebaseConfig = {
            apiKey: "AIzaSyAzY...", 
            authDomain: "roadsidehero-104ea.firebaseapp.com",
            projectId: "roadsidehero-104ea",
            storageBucket: "roadsidehero-104ea.appspot.com",
            messagingSenderId: "1098...",
            appId: "1:1098..."
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function toggleSidebarWidth() {
            const sidebar = document.getElementById('searchModule');
            const feed = document.getElementById('view-home');
            
            sidebar.classList.toggle('collapsed');
            feed.classList.toggle('expanded-feed');
        }

        async function loginPro() {
            const email = document.getElementById('proEmail').value;
            const pass = document.getElementById('proPass').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                alert("Logged in successfully!");
                // Redirect or update UI
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        function switchView(view) {
            const home = document.getElementById('view-home');
            const prof = document.getElementById('view-profile');
            const side = document.getElementById('searchModule');

            if(view === 'profile') {
                home.style.display = 'none';
                prof.style.display = 'block';
                side.style.display = 'none';
            } else {
                home.style.display = 'block';
                prof.style.display = 'none';
                side.style.display = 'block';
            }
        }
    </script>
</body>
</html>
