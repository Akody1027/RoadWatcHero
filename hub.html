<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Hub Marketplace</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <style>
        :root { --accent: #EE611C; --bg: #ffffff; --secondary: #f1f5f9; --text: #0f172a; --muted: #64748b; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); }
        
        /* SEARCH & SETTINGS BAR */
        .hub-header { position: sticky; top: 0; background: white; z-index: 100; padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .search-row { display: flex; align-items: center; background: var(--secondary); border-radius: 10px; padding: 5px 12px; }
        #searchInput { flex: 1; border: none; background: none; padding: 10px; outline: none; font-size: 16px; }
        .settings-icon { font-size: 20px; cursor: pointer; color: var(--accent); padding-left: 10px; }
        
        /* DISTANCE SLIDER DROPDOWN */
        #settingsDropdown { display: none; padding: 15px; background: white; border-bottom: 1px solid #e2e8f0; animation: slideDown 0.2s ease; }
        .slider-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 10px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

        /* AUTH & PRO UPSELL */
        #authGate { padding: 30px 20px; text-align: center; }
        .auth-container { max-width: 400px; margin: auto; padding: 25px; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .auth-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 16px; margin-top: 15px; cursor: pointer; }
        .pro-promo { margin-top: 25px; padding-top: 20px; border-top: 1px dashed #cbd5e1; }
        .price-tag { color: var(--accent); font-size: 24px; font-weight: 900; display: block; margin: 10px 0; }

        /* FEED & CARDS */
        #marketplaceFeed { padding: 15px; }
        .hero-card { background: white; border: 1px solid #e2e8f0; border-radius: 15px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .hero-img { width: 100%; height: 180px; object-fit: cover; }
        .hero-details { padding: 15px; }
        .hero-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 5px; }
        .verified-check { color: var(--accent); font-size: 16px; }
        .btn-call { display: block; background: #10b981; color: white; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 800; margin-top: 15px; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="hub-header">
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Search Towing, Mechanic, Detailer..." onkeyup="filterFeed()">
            <div class="settings-icon" onclick="toggleSettings()">⚙️</div>
        </div>
    </div>

    <div id="settingsDropdown">
        <div class="slider-meta">
            <span>DISTANCE RADIUS</span>
            <span id="radiusText">50 MILES</span>
        </div>
        <input type="range" id="radiusSlider" min="5" max="250" value="50" oninput="updateRadius(this.value)">
    </div>

    <div id="authGate" style="display: none;">
        <div class="auth-container">
            <h2 style="margin-top: 0;">Hero Pro Portal</h2>
            <input type="email" id="email" class="auth-input" placeholder="Email Address">
            <input type="password" id="pass" class="auth-input" placeholder="Password">
            <button class="btn-action" onclick="handleLogin()">LOGIN TO DASHBOARD</button>
            
            <div class="pro-promo">
                <p style="font-weight: 700; margin: 0;">WANT MORE LEADS?</p>
                <span class="price-tag">$9.99 / Month</span>
                <p style="font-size: 13px; color: var(--muted);">Join the Hero Hub network. Get listed, get calls, grow your business.</p>
                <button class="btn-action" style="background: #1e293b;" onclick="window.location.href='YOUR_STRIPE_LINK'">SIGN UP TO BE A PRO</button>
            </div>
        </div>
    </div>

    <div id="marketplaceFeed"></div>

    <script>
        // FIREBASE INTEGRATION - Using your roadsidehero-104ea credentials
        const firebaseConfig = {
            apiKey: "AIzaSyAzY...", // Retrieval shortened for space; use your full home.html key
            authDomain: "roadsidehero-104ea.firebaseapp.com",
            projectId: "roadsidehero-104ea",
            storageBucket: "roadsidehero-104ea.appspot.com",
            messagingSenderId: "1098...",
            appId: "1:1098..."
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 1. SETTINGS & RADIUS
        function toggleSettings() {
            const ds = document.getElementById('settingsDropdown');
            ds.style.display = ds.style.display === 'block' ? 'none' : 'block';
        }

        function updateRadius(val) {
            document.getElementById('radiusText').innerText = val + " MILES";
            // In a real app, this would trigger a GeoFirestore query
        }

        // 2. AUTHENTICATION & PRO CHECK
        auth.onAuthStateChanged(user => {
            if (!user) {
                // If they are trying to access 'My Profile', show authGate
                // For now, marketplace stays public
            }
        });

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                alert("Logged In Successfully");
            } catch (e) {
                alert(e.message);
            }
        }

        // 3. THE FEED (Dynamic Loading)
        async function loadFeed() {
            const feed = document.getElementById('marketplaceFeed');
            feed.innerHTML = ''; 

            db.collection("heroes").where("status", "==", "active").limit(15).get().then(snap => {
                if(snap.empty) {
                    feed.innerHTML = `<div style="text-align:center; padding:50px;">
                        <p style="color:var(--muted)">No Pros nearby yet.</p>
                        <button class="btn-action" style="width:auto; padding: 10px 20px;" onclick="requestSection()">SUGGEST A CATEGORY</button>
                    </div>`;
                    return;
                }
                snap.forEach(doc => renderCard(doc.data()));
            });
        }

        function renderCard(data) {
            const html = `
                <div class="hero-card">
                    <img src="${data.imageUrl}" class="hero-img">
                    <div class="hero-details">
                        <div class="hero-title">${data.name} <span class="verified-check">✔</span></div>
                        <p style="color:var(--muted); font-size:13px; margin:5px 0;">${data.category} • ${data.distance || 'Near You'}</p>
                        <p style="font-size:14px;">${data.description}</p>
                        <a href="tel:${data.phone}" class="btn-call" onclick="trackLead('${data.id}')">CALL NOW</a>
                    </div>
                </div>
            `;
            document.getElementById('marketplaceFeed').innerHTML += html;
        }

        // 4. LEADS & PINGS
        function trackLead(id) {
            // Update Firestore lead count
            db.collection("heroes").doc(id).update({
                totalLeads: firebase.firestore.FieldValue.increment(1)
            });
            // Parent shell handles the sound
            window.parent.postMessage('ping_notification', '*');
        }

        function requestSection() {
            const suggestion = prompt("What service do you need?");
            if(suggestion) {
                db.collection("category_requests").add({ name: suggestion, date: new Date() });
                alert("Thanks! We'll look for Pros in that category.");
            }
        }

        loadFeed();
    </script>
</body>
</html>
