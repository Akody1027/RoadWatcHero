<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Hub Marketplace</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <style>
        :root { --accent: #EE611C; --bg: #f1f5f9; --surface: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); }

        /* HEADER & NAV */
        .hub-main-header { background: var(--surface); padding: 20px 15px; text-align: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .hub-main-header h1 { margin: 0; font-size: 22px; font-weight: 900; }
        
        .nav-bar { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 67px; z-index: 99; }
        .nav-btn { flex: 1; padding: 15px; text-align: center; font-size: 24px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; }
        .nav-btn.active { color: var(--accent); border-bottom: 3px solid var(--accent); }

        /* DRAWER & FORM */
        #searchDrawer { position: fixed; top: 0; left: -100%; width: 90%; height: 100%; background: var(--surface); z-index: 200; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 10px 0 25px rgba(0,0,0,0.1); overflow-y: auto; padding-bottom: 50px; }
        #searchDrawer.open { left: 0; }
        .drawer-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .drawer-content { padding: 20px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
        .input-style { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; }

        /* CATEGORY BUBBLES WITH IMAGE PLACEHOLDERS */
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
        .cat-bubble { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 5px; text-align: center; cursor: pointer; transition: 0.2s; }
        .cat-bubble img { width: 35px; height: 35px; display: block; margin: 0 auto 8px auto; opacity: 0.6; }
        .cat-bubble span { font-size: 11px; font-weight: 700; color: var(--text); display: block; }
        .cat-bubble.active { border-color: var(--accent); background: #fff0eb; }
        .cat-bubble.active span { color: var(--accent); }

        /* FEED & EMPTY STATE */
        .view-section { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        .empty-placeholder { text-align: center; padding: 60px 20px; color: var(--muted); }
        .empty-icon { font-size: 50px; margin-bottom: 15px; display: block; }
        
        .ad-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 20px; overflow: hidden; }
        .ad-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .btn-call { display: block; background: #10b981; color: white; padding: 15px; text-align: center; border-radius: 10px; text-decoration: none; font-weight: 800; }

        #drawerOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="hub-main-header"><h1>Hero Hub</h1></div>

    <div class="nav-bar">
        <div class="nav-btn" onclick="toggleDrawer()">🔍</div>
        <div class="nav-btn active" id="nav-home" onclick="switchView('home')">🏠</div>
        <div class="nav-btn" id="nav-profile" onclick="switchView('profile')">👤</div>
    </div>

    <div id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div id="searchDrawer">
        <div class="drawer-header">
            <h2 style="margin:0; font-weight: 900;">Filters</h2>
            <button style="border:none; background:none; font-size:24px;" onclick="toggleDrawer()">✖</button>
        </div>
        <div class="drawer-content">
            <div class="input-group">
                <label>Manual Location (City or Zip)</label>
                <input type="text" class="input-style" id="manualLocation" placeholder="Enter city or address...">
            </div>

            <div class="input-group">
                <label>Search Radius (Miles)</label>
                <input type="range" min="5" max="100" value="25" style="width:100%; accent-color:var(--accent);" oninput="document.getElementById('rVal').innerText = this.value">
                <div style="text-align:right; font-size:12px; font-weight:800;" id="rVal">25</div>
            </div>

            <label style="display:block; font-size:12px; font-weight:800; color:var(--muted); margin-bottom:10px;">Categories</label>
            <div class="category-grid">
                <div class="cat-bubble" onclick="selectCat(this)">
                    <img src="https://www.roadwatchero.com/assets/placeholders/tow.png" alt="Icon">
                    <span>Towing</span>
                </div>
                <div class="cat-bubble" onclick="selectCat(this)">
                    <img src="https://www.roadwatchero.com/assets/placeholders/mechanic.png" alt="Icon">
                    <span>Mechanic</span>
                </div>
                <div class="cat-bubble" onclick="selectCat(this)">
                    <img src="https://www.roadwatchero.com/assets/placeholders/detail.png" alt="Icon">
                    <span>Detailing</span>
                </div>
                <div class="cat-bubble" onclick="selectCat(this)">
                    <img src="https://www.roadwatchero.com/assets/placeholders/tire.png" alt="Icon">
                    <span>Tires</span>
                </div>
                <div class="cat-bubble" onclick="selectCat(this)">
                    <img src="https://www.roadwatchero.com/assets/placeholders/lock.png" alt="Icon">
                    <span>Locksmith</span>
                </div>
                <div class="cat-bubble" onclick="selectCat(this)">
                    <img src="https://www.roadwatchero.com/assets/placeholders/tint.png" alt="Icon">
                    <span>Window Tint</span>
                </div>
                <div class="cat-bubble" onclick="selectCat(this)">
                    <img src="https://www.roadwatchero.com/assets/placeholders/glass.png" alt="Icon">
                    <span>Auto Glass</span>
                </div>
                <div class="cat-bubble" onclick="selectCat(this)">
                    <img src="https://www.roadwatchero.com/assets/placeholders/battery.png" alt="Icon">
                    <span>Battery</span>
                </div>
                <div class="cat-bubble" onclick="selectCat(this)">
                    <img src="https://www.roadwatchero.com/assets/placeholders/wrap.png" alt="Icon">
                    <span>Vinyl Wrap</span>
                </div>
            </div>
            
            <button class="btn-primary" style="background:var(--accent); border:none; color:white; width:100%; padding:15px; border-radius:10px; font-weight:800; margin-top:30px;" onclick="toggleDrawer()">APPLY FILTERS</button>
        </div>
    </div>

    <div id="view-home" class="view-section active">
        <div id="emptyFeed" class="empty-placeholder">
            <span class="empty-icon">⏳</span>
            <h3>No Heroes Active Nearby</h3>
            <p>Waiting for businesses to post in your area. Check back soon!</p>
            <button style="background:none; border:1px solid var(--accent); color:var(--accent); padding:10px 20px; border-radius:8px; font-weight:700; margin-top:10px;" onclick="toggleDrawer()">Change Location</button>
        </div>
        <div id="feedContent"></div>
    </div>

    <div id="view-profile" class="view-section">
        <div class="auth-card" style="background:white; padding:25px; border-radius:16px; border:1px solid var(--border); text-align:center;">
            <h2 style="margin-top:0">Pro Portal</h2>
            <input type="email" id="email" class="input-style" placeholder="Email Address" style="margin-bottom:10px;">
            <input type="password" id="pass" class="input-style" placeholder="Password" style="margin-bottom:15px;">
            <button style="width:100%; padding:15px; background:var(--accent); color:white; border:none; border-radius:10px; font-weight:800;">LOGIN</button>
            <div style="margin-top:20px; border-top:1px dashed #ccc; padding-top:20px;">
                <p style="font-weight:800; color:var(--muted); margin:0;">START GETTING LEADS</p>
                <span style="font-size:24px; font-weight:900; color:var(--accent); display:block; margin:5px 0;">$9.99 / mo</span>
                <button style="width:100%; padding:15px; background:#1e293b; color:white; border:none; border-radius:10px; font-weight:800;">JOIN THE HUB</button>
            </div>
        </div>
    </div>

    <script>
        // 1. YOUR FIREBASE CONFIG FROM HOME.HTML
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "roadsidehero-104ea.firebaseapp.com",
            projectId: "roadsidehero-104ea",
            storageBucket: "roadsidehero-104ea.appspot.com",
            messagingSenderId: "1098555808544",
            appId: "1:1098555808544:web:043b3531b7829777174640"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
            if(document.getElementById('nav-' + view)) document.getElementById('nav-' + view).classList.add('active');
        }

        function toggleDrawer() {
            const dr = document.getElementById('searchDrawer');
            const ov = document.getElementById('drawerOverlay');
            const isOpen = dr.classList.toggle('open');
            ov.style.display = isOpen ? 'block' : 'none';
        }

        function selectCat(el) {
            el.classList.toggle('active');
        }

        // Logic to show/hide placeholder based on data
        function updateFeed(hasData) {
            document.getElementById('emptyFeed').style.display = hasData ? 'none' : 'block';
        }

        // Initial check (starts as empty)
        updateFeed(false);
    </script>
</body>
</html>
