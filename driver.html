<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Driver Login | RoadWatcHero</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #ee611c;
      --danger: #ef4444;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, system-ui, sans-serif;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #loginContainer {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      text-align: center;
    }

    #loginContainer img {
      width: 200px;
      margin-bottom: 20px;
      filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.1));
    }

    h2 {
      margin-top: 0;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 5px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 30px;
      font-weight: 500;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
      font-size: 16px;
      font-weight: 600;
      background: white;
      transition: border-color 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 16px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(238, 97, 28, 0.3);
      transition: transform 0.1s ease;
      margin-top: 10px;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* GLASS LOADING OVERLAY */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(238, 97, 28, 0.2);
      border-top: 5px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loader-hidden { opacity: 0; visibility: hidden; }
  </style>
</head>
<body>

  <div id="loadingOverlay" class="loader-hidden">
    <div class="spinner"></div>
  </div>

  <div id="loginContainer">
    <img src="roadwatchlogo.png" alt="RoadWatcHero" onerror="this.src='https://via.placeholder.com/200x50?text=RoadWatcHero'">
    <h2>Driver Portal</h2>
    <p class="subtitle">Enter the credentials provided by your dispatcher.</p>

    <div class="input-group">
      <label>Phone Number</label>
      <input type="tel" id="driverPhone" placeholder="e.g. 555-555-5555">
    </div>

    <div class="input-group">
      <label>6-Digit PIN</label>
      <input type="number" id="driverPin" placeholder="------">
    </div>

    <button class="submit-btn" onclick="window.submitDriverLogin()">SECURE LOGIN</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgXWZkH0WMjhGmOfxjqbIDoJHlyA1pc-o",
      authDomain: "roadsidehero-104ea.firebaseapp.com",
      databaseURL: "https://roadsidehero-104ea-default-rtdb.firebaseio.com",
      projectId: "roadsidehero-104ea",
      storageBucket: "roadsidehero-104ea.firebasestorage.app",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.submitDriverLogin = async () => {
      const phoneInput = document.getElementById('driverPhone').value.trim();
      const pinInput = document.getElementById('driverPin').value.trim();

      if (!phoneInput || !pinInput) {
        return alert("Please enter both your Phone Number and PIN.");
      }

      const loader = document.getElementById('loadingOverlay');
      loader.classList.remove('loader-hidden');

      try {
        // Query the entire profiles node to hunt for the shop that owns this driver
        const snap = await get(ref(db, 'profiles'));
        if (snap.exists()) {
          const allProfiles = snap.val();
          let matchFound = false;

          for (const shopId in allProfiles) {
            const shop = allProfiles[shopId];
            
            // If the shop is a Pro and has an active fleet
            if (shop.isPro && shop.fleetDrivers && Array.isArray(shop.fleetDrivers)) {
              
              // Hunt for the driver in their array
              const matchingDriver = shop.fleetDrivers.find(d => d.phone === phoneInput && d.pin === pinInput);
              
              if (matchingDriver) {
                // WE FOUND A MATCH!
                matchFound = true;

                // 1. Generate a unique ID for this device based on their phone
                const safeDriverId = "fleet_" + phoneInput.replace(/\D/g,'');

                // 2. Save the credentials securely to the device
                localStorage.setItem("heroUserId", safeDriverId);
                localStorage.setItem("heroRole", "fleet_driver");
                localStorage.setItem("shopId", shopId);
                localStorage.setItem("driverName", matchingDriver.name);

                // 3. Redirect them into the main app experience
                // IMPORTANT: Ensure this matches your main file name!
                window.location.href = "home (16).html"; 
                break; 
              }
            }
          }

          if (!matchFound) {
            alert("Invalid Credentials. Please verify your Phone and PIN with your dispatcher.");
          }
        } else {
          alert("No dispatchers found in the system.");
        }
      } catch (error) {
        console.error("Login Error:", error);
        alert("A network error occurred. Please try again.");
      } finally {
        loader.classList.add('loader-hidden');
      }
    };
  </script>
</body>
</html>
