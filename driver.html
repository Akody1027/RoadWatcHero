<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Driver Dashboard | RoadWatcHero</title>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDQw84A7XeEN1qNdUNzPoWDF_26XmeVezQ&libraries=geometry"></script>

    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #ee611c;
        --danger: #ef4444;
        --success: #22c55e;
        --tow-blue: #2563eb;
        --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, system-ui, sans-serif;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }

      /* LOADING SPINNER */
      #loadingOverlay {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(5px);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.3s;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(238, 97, 28, 0.2);
        border-top: 5px solid var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
      .loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* VIEWS */
      .view {
        display: none;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        flex-direction: column;
      }
      .view-active {
        display: flex;
      }

      /* LOGIN UI */
      #loginView {
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
        padding: 30px;
        text-align: center;
      }
      #loginView img {
        width: 200px;
        margin-bottom: 20px;
      }
      .input-group {
        margin-bottom: 20px;
        text-align: left;
        width: 100%;
        max-width: 400px;
      }
      .input-group label {
        display: block;
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      input {
        width: 100%;
        padding: 16px;
        border-radius: 14px;
        border: 2px solid #e2e8f0;
        font-size: 16px;
        font-weight: 600;
        background: white;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .submit-btn {
        width: 100%;
        max-width: 400px;
        padding: 18px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 16px;
        font-weight: 800;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(238, 97, 28, 0.3);
        margin-top: 10px;
      }

      /* DASHBOARD UI */
      #driverMap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        bottom: 45vh; /* Stops exactly where the panel starts */
        transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 1;
      }
      .dashboard-collapsed #driverMap {
        bottom: 0; /* Expands downward to fill the screen */
      }

      #topBar {
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 15px 20px;
        border-radius: 20px;
        box-shadow: var(--shadow);
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        background: var(--success);
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
        }
      }

      #bottomPanel {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: white;
        border-radius: 30px 30px 0 0;
        box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.1);
        padding: 25px 20px;
        z-index: 10;
        height: 80vh;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .job-card {
        background: #f8fafc;
        border: 2px solid var(--tow-blue);
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 15px;
      }
      .job-card.empty {
        border-color: #e2e8f0;
        text-align: center;
        padding: 30px;
        color: var(--muted);
        font-weight: 700;
      }

      .job-details-block {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px;
        margin: 15px 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .job-detail-row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #f8fafc;
        padding-bottom: 6px;
      }
      .job-detail-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .job-detail-label {
        font-size: 15px;
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
      }
      .job-detail-value {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        text-align: right;
        max-width: 65%;
        word-wrap: break-word;
      }

      .action-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 15px;
      }
      .action-btn {
        background: white;
        border: 1px solid var(--accent);
        border-radius: 12px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 800;
        color: var(--text);
        cursor: pointer;
        text-decoration: none;
        transition: 0.2s;
      }
      .action-btn:active {
        transform: scale(0.95);
      }
      .action-btn.primary {
        background: var(--warning);
        border-color: var(--warning);
        color: white;
        grid-column: span 4;
        font-size: 14px;
        padding: 15px;
      }
      .action-btn.done {
        background: var(--success);
        border-color: var(--success);
        color: white;
        grid-column: span 4;
        font-size: 14px;
        padding: 15px;
      }

      #topBar,
      #bottomPanel {
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.4s ease;
      }
      .dashboard-collapsed #topBar {
        transform: translateY(-150%);
        opacity: 0;
        pointer-events: none;
      }
      .dashboard-collapsed #bottomPanel {
        transform: translateY(120%);
        opacity: 0;
        pointer-events: none;
      }

      @keyframes fabPulse {
        0% {
          box-shadow: 0 0 0 2px rgba(238, 97, 28, 0.4);
        }
        20% {
          box-shadow: 0 0 0 10px rgba(238, 97, 28, 0.5);
        }
        60% {
          box-shadow: 0 0 0 10px rgba(238, 97, 28, 0.5);
        }
        80% {
          box-shadow: 0 0 0 10px rgba(238, 97, 28, 0.4);
        }
        100% {
          box-shadow: 0 0 0 2px rgba(238, 97, 28, 0.4);
        }
      }
      .fab-btn {
        position: absolute;
        bottom: 20px;
        left: 20px;
        width: 56px;
        height: 56px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
        animation: fabPulse 2.5s infinite cubic-bezier(0.66, 0, 0, 1);
        opacity: 0.9;
      }
      .fab-btn:active {
        transform: scale(0.95);
      }

       #lineupContainer {
         margin-top:1%;
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding-bottom: 250px;
      }
      .lineup-item {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 15px;
        padding: 12px 15px;
        min-width: 200px;
        flex-shrink: 0;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
      }

      /* MODALS */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  display: none;
  justify-content: center;
  align-items: center; /* Or center, depending on your preference */
  z-index: 1000;
  overflow: hidden; /* Prevents the whole screen from scrolling */
}

.modal-content {
  background: white;
  width: 100%;
  max-width: 600px;
  height: 90vh;
  max-height: 90vh;/* Limits height so it doesn't overflow the viewport */
  overflow-y: auto; /* THIS IS THE FIX: Enables vertical scrolling inside the content */
  border-radius: 20px 20px 0 0;
  padding: 20px;
  position: relative;
  /* Add this if you want smooth scrolling on touch devices */
  -webkit-overflow-scrolling: touch; 
}
      .close-x-btn {
        background: var(--accent);
        color: white;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-weight: bold;
        cursor: pointer;
      }
      #chatBox {
        flex: 1;
        overflow-y: auto;
        background: #f8fafc;
        border-radius: 20px;
        padding: 15px;
        margin-bottom: 15px;
        border: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        padding: 12px 16px;
        border-radius: 18px;
        max-width: 80%;
        font-size: 14px;
      }
      .msg-me {
        align-self: flex-end;
        background: var(--accent);
        color: white;
        border-bottom-right-radius: 4px;
      }
      .msg-them {
        align-self: flex-start;
        background: white;
        color: var(--text);
        border-bottom-left-radius: 4px;
        border: 1px solid #e2e8f0;
      }

      .footer-icons {
        display: flex;
        justify-content: space-around;
        width: 100%;
        align-items: center;
      }
      .badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: #ef4444;
        color: white;
        font-size: 10px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: none;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        border: 2px solid var(--accent);
      }
      .locked-input {
        background: #f1f5f9;
        color: #94a3b8;
        cursor: not-allowed;
        border: 1px solid #e2e8f0;
      }
      .locked-input:focus {
        border-color: #e2e8f0;
        box-shadow: none;
      }
      .hub-thread {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        border-bottom: 1px solid #e2e8f0;
        cursor: pointer;
        transition: background 0.2s;
      }
      .hub-thread:active {
        background: #f1f5f9;
      }
      .hub-thread:last-child {
        border-bottom: none;
      }

      .alert-banner {
        position: fixed;
        top: -100px;
        left: 0;
        width: 100%;
        background: var(--success);
        color: white;
        text-align: center;
        padding: 18px 20px;
        font-weight: 900;
        font-size: 14px;
        z-index: 10000;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
      }
      .alert-banner.show {
        transform: translateY(100px);
      }
    </style>
  </head>
  <body>
    <div id="loadingOverlay"><div class="spinner"></div></div>

    <div id="loginView" class="view view-active">
      <img
        src="roadwatchlogo.png"
        alt="RoadWatcHero"
        onerror="this.src='https://via.placeholder.com/200x50?text=RoadWatcHero'"
      />
      <h2 style="margin: 0 0 5px 0">Driver Portal</h2>
      <p
        style="
          font-size: 14px;
          color: var(--muted);
          margin-bottom: 30px;
          font-weight: 500;
        "
      >
        Enter your dispatch credentials.
      </p>

      <div class="input-group">
        <label>Phone Number</label
        ><input type="tel" id="driverPhone" placeholder="e.g. 555-555-5555" />
      </div>
      <div class="input-group">
        <label>6-Digit PIN</label
        ><input type="number" id="driverPin" placeholder="------" />
      </div>
      <button class="submit-btn" onclick="window.submitDriverLogin()">
        SECURE LOGIN
      </button>
    </div>

    <div id="dashboardView" class="view">
      <div id="topBar">
        <div style="font-weight: 900; font-size: 16px">
          <span class="status-dot"></span
          ><span id="headerDriverName">Driver</span>
        </div>
        <button
          onclick="window.logoutDriver()"
          style="
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 800;
            color: var(--danger);
            cursor: pointer;
          "
        >
          LOGOUT
        </button>
      </div>

      <button
        id="fabMapToggle"
        class="fab-btn"
        onclick="window.toggleDashboard()"
        style="font-size: 35px"
      >
        ⚙️
      </button>

      <div id="driverMap"></div>

      <div id="bottomPanel">
        <div style="width: 100%; text-align: center; margin-bottom: 2%">
          <h1 style="text-align: center">Pro Hero</h1>
        </div>

        <div id="activeJobCard"></div>

        <div
          style="
            font-size: 20px;
            font-weight: 900;
            color: var(--muted);
            margin: 30px 0 0px 0;
            text-align:center;
          "
        >
          NEXT DISPATCH
        </div>
        <div id="lineupContainer"></div>
      </div>
    </div>

    <div id="dispatchAlertBanner" class="alert-banner">
      🚨 NEW DISPATCH ASSIGNED!
    </div>
    <audio id="notificationSound" src="Roadwatchero.mp3" preload="auto"></audio>

    <div
      id="driverFooter"
      style="
        position: absolute;
        bottom: 0;
        width: 100%;
        background: var(--accent);
        padding: 10px 0;
        z-index: 200;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.4s ease;
      "
    >
      <div class="footer-icons">
        <img
          src="usericon.png"
          onclick="window.openDriverProfile()"
          style="
            cursor: pointer;
            width: 30px;
            height: 30px;
            filter: brightness(0) invert(1);
          "
          alt="Profile"
        />
        <img
          src="thishomeicon.png"
          onclick="window.location.href='home.html'"
          style="
            cursor: pointer;
            width: 35px;
            height: 35px;
            filter: brightness(0) invert(1);
          "
          alt="Home"
        />
        <div style="position: relative">
          <img
            src="Chaticon.png"
            onclick="window.openMessageHub()"
            style="
              cursor: pointer;
              width: 30px;
              height: 30px;
              filter: brightness(0) invert(1);
            "
            alt="Messages"
          />
          <div id="hubBadge" class="badge">0</div>
        </div>
      </div>
    </div>

    <div id="profileModal" class="modal">
      <div class="modal-content">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          "
        >
          <h3 style="margin: 0; color: var(--accent)">Driver Profile</h3>
          <button
            class="close-x-btn"
            onclick="document.getElementById('profileModal').style.display='none'"
          >
            ✕
          </button>
        </div>
        <div style="text-align: center; margin-bottom: 25px">
          <div
            id="profileImagePreview"
            onclick="document.getElementById('profileImageUpload').click()"
            style="
              width: 90px;
              height: 90px;
              background: var(--accent);
              border-radius: 50%;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              color: white;
              font-size: 40px;
              font-weight: bold;
              cursor: pointer;
              box-shadow: 0 4px 10px rgba(238, 97, 28, 0.3);
              background-size: cover;
              background-position: center;
            "
          >
            +
          </div>
          <input
            type="file"
            id="profileImageUpload"
            style="display: none"
            accept="image/*"
            onchange="window.handleProfileImage(event)"
          />
        </div>

        <label
          style="
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            margin-bottom: 4px;
            display: block;
          "
          >NAME 🔒</label
        >
        <input type="text" id="profName" class="locked-input" readonly />

        <label
          style="
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            margin-bottom: 4px;
            display: block;
            margin-top: 15px;
          "
          >DRIVER PIN 🔒</label
        >
        <input type="text" id="profPin" class="locked-input" readonly />

        <label
          style="
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            margin-bottom: 4px;
            display: block;
            margin-top: 15px;
          "
          >PHONE NUMBER</label
        >
        <input type="tel" id="profPhone" placeholder="e.g. 555-555-5555" />

        <label
          style="
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            margin-bottom: 4px;
            display: block;
            margin-top: 15px;
          "
          >DRIVER ID / EMPLOYEE #</label
        >
        <input type="text" id="profEmpId" placeholder="e.g. EMP-104" />

        <button
          class="submit-btn"
          onclick="window.saveDriverProfile()"
          style="margin-top: 25px"
        >
          SAVE SETTINGS
        </button>
      </div>
    </div>

    <div id="hubModal" class="modal">
      <div class="modal-content">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          "
        >
          <h3 style="margin: 0; color: var(--accent)">Messaging Hub</h3>
          <button
            class="close-x-btn"
            onclick="document.getElementById('hubModal').style.display='none'"
          >
            ✕
          </button>
        </div>

        <button
          onclick="window.openChat('dispatch_' + myShopId)"
          style="
            width: 100%;
            padding: 18px;
            background: var(--bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            font-weight: 900;
            color: var(--text);
            font-size: 14px;
            margin-bottom: 25px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
          "
        >
          🏢 CONTACT DISPATCH
        </button>

        <div
          style="
            font-size: 11px;
            font-weight: 900;
            color: var(--muted);
            margin-bottom: 10px;
            text-transform: uppercase;
          "
        >
          Active Job Threads
        </div>
        <div
          id="hubThreadList"
          style="
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #f8fafc;
          "
        ></div>
      </div>
    </div>

    <div id="chatModal" class="modal">
      <div class="modal-content">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
          "
        >
          <h3 style="margin: 0; color: var(--accent)">Chat</h3>
          <button
            class="close-x-btn"
            onclick="document.getElementById('chatModal').style.display='none'"
          >
            ✕
          </button>
        </div>
        <div id="chatBox"></div>
        <div style="display: flex; gap: 10px">
          <input
            id="chatInput"
            placeholder="Type message..."
            style="margin: 0; flex: 1"
          />
          <button
            onclick="window.sendTextMsg()"
            style="
              background: var(--accent);
              color: white;
              border: none;
              padding: 0 20px;
              border-radius: 15px;
              font-weight: bold;
            "
          >
            SEND
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import {
        getDatabase,
        ref,
        get,
        onValue,
        update,
        push,
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBgXWZkH0WMjhGmOfxjqbIDoJHlyA1pc-o",
        authDomain: "roadsidehero-104ea.firebaseapp.com",
        databaseURL: "https://roadsidehero-104ea-default-rtdb.firebaseio.com",
        projectId: "roadsidehero-104ea",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      let map, userLocation, driverMarker;
      let jobMarkers = [];
      let myDriverId = localStorage.getItem("heroUserId");
      let myShopId = localStorage.getItem("shopId");
      let activeChatId = null;
      let previousJobCount = -1;
      let lastChatTimestamp = 0;
      window.currentJobsCache = [];

      // --- 1. INIT & AUTH ---
      window.onload = () => {
        if (myDriverId && localStorage.getItem("heroRole") === "fleet_driver") {
          showDashboard();
        } else {
          document
            .getElementById("loadingOverlay")
            .classList.add("loader-hidden");
        }
      };

      window.submitDriverLogin = async () => {
        const phoneInput = document.getElementById("driverPhone").value.trim();
        const pinInput = document.getElementById("driverPin").value.trim();
        if (!phoneInput || !pinInput)
          return alert("Please enter Phone and PIN.");

        document
          .getElementById("loadingOverlay")
          .classList.remove("loader-hidden");
        try {
          const snap = await get(ref(db, "profiles"));
          if (snap.exists()) {
            const allProfiles = snap.val();
            for (const shopId in allProfiles) {
              const shop = allProfiles[shopId];
              if (shop.isPro && shop.fleetDrivers) {
                const match = shop.fleetDrivers.find(
                  (d) => d.phone === phoneInput && d.pin === pinInput
                );

                if (match) {
                  myDriverId = "fleet_" + phoneInput.replace(/\D/g, "");
                  myShopId = shopId;
                  localStorage.setItem("heroUserId", myDriverId);
                  localStorage.setItem("heroRole", "fleet_driver");
                  localStorage.setItem("shopId", shopId);
                  localStorage.setItem("driverName", match.name);
                  localStorage.setItem("driverPin", pinInput);
                  localStorage.setItem("driverPhone", match.phone);
                  return showDashboard();
                }
              }
            }
            alert("Invalid Credentials.");
          }
        } catch (e) {
          alert("Network Error.");
        } finally {
          document
            .getElementById("loadingOverlay")
            .classList.add("loader-hidden");
        }
      };

      window.logoutDriver = () => {
        localStorage.clear();
        location.reload();
      };

      // --- 2. DASHBOARD & MAP INIT ---
      function showDashboard() {
        document.getElementById("loginView").classList.remove("view-active");

        document.getElementById("dashboardView").classList.add("view-active");
        document.getElementById("headerDriverName").innerText =
          localStorage.getItem("driverName") || "Driver";
        document
          .getElementById("loadingOverlay")
          .classList.add("loader-hidden");

        initMap();
        startLocationWatch();
        listenToJobs();
        listenToChats();
      }

      function initMap() {
        map = new google.maps.Map(document.getElementById("driverMap"), {
          center: { lat: 39.8283, lng: -98.5795 },
          zoom: 4,
          disableDefaultUI: true,
          gestureHandling: "greedy",
        });
      }

      function startLocationWatch() {
        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(
            (p) => {
              userLocation = {
                lat: p.coords.latitude,
                lng: p.coords.longitude,
              };

              if (!driverMarker) {
                driverMarker = new google.maps.Marker({
                  position: userLocation,
                  map: map,
                  icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 8,
                    fillColor: "#2563eb",
                    fillOpacity: 1,
                    strokeColor: "white",
                    strokeWeight: 2,
                  },
                });
                map.setCenter(userLocation);
                map.setZoom(13);
              } else {
                driverMarker.setPosition(userLocation);
              }

              // Save location so dispatcher can see them
              update(
                ref(db, `profiles/${myShopId}/driverLocations/${myDriverId}`),
                userLocation
              );
            },
            (err) => console.error(err),
            { enableHighAccuracy: true }
          );
        }
      }

      function listenToJobs() {
        onValue(ref(db, "sosRequests"), (snap) => {
          const data = snap.val() || {};
          const myJobs = [];

          Object.keys(data).forEach((key) => {
            const job = data[key];
            if (
              (job.assignedDriver === myDriverId ||
                job.driverId === myDriverId ||
                job.shopId === myShopId ||
                job.assignedShop === myShopId) &&
              job.status !== "completed" &&
              job.status !== "canceled"
            ) {
              job.id = key;
              myJobs.push(job);
            }
          });

          // --- NEW ALERT LOGIC & HUB CACHE ---
          window.currentJobsCache = myJobs;

          if (previousJobCount !== -1 && myJobs.length > previousJobCount) {
            const banner = document.getElementById("dispatchAlertBanner");
            if (banner) banner.classList.add("show");
            const sound = document.getElementById("notificationSound");
            if (sound) sound.play().catch((e) => {});
            setTimeout(() => {
              if (banner) banner.classList.remove("show");
            }, 4000);
          }
          previousJobCount = myJobs.length;
          // -----------------------------------

          renderQueue(myJobs);
          renderMapMarkers(myJobs);
        });
      }

      
      
      
      
      function renderQueue(jobs) {
              const activeCard = document.getElementById("activeJobCard");
              const lineupCont = document.getElementById("lineupContainer");

              if (jobs.length === 0) {
                activeCard.innerHTML = `<div class="job-card empty">📡 Waiting for dispatch...</div>`;
                lineupCont.innerHTML = `<div style="font-size:12px; color:var(--muted); font-style:italic;">Queue is empty.</div>`;
                return;
              }

              const generateCardContent = (job, isActive) => {
                const dist = userLocation && job.lat
                  ? (google.maps.geometry.spherical.computeDistanceBetween(
                      new google.maps.LatLng(userLocation.lat, userLocation.lng),
                      new google.maps.LatLng(job.lat, job.lng)
                    ) / 1609.34).toFixed(1)
                  : "?";

                let imageBlock = `<div style="background:#f1f5f9; color:var(--muted); font-size:15px; font-weight:800; text-align:center; padding:15px; border-radius:12px; margin-bottom:15px; border:1px dashed #cbd5e1;">NO DAMAGE IMAGES UPLOADED</div>`;
                
                if (job.damageImages) {
                  let imgArr = Array.isArray(job.damageImages) ? job.damageImages : [job.damageImages];
                  if (imgArr.length > 0) {
                    imageBlock = `<div style="display:flex; gap:10px; overflow-x:auto; margin-bottom:15px; padding-bottom:5px;">` +
                      imgArr.map(src => `<img src="${src}" style="height:90px; width:90px; object-fit:cover; border-radius:12px; border:1px solid #e2e8f0; flex-shrink:0;" onclick="window.open('${src}', '_blank')">`).join('') +
                      `</div>`;
                  }
                }

                const borderColor = isActive 
                  ? (job.status === "arrived" ? "var(--warning)" : "var(--tow-blue)") 
                  : "#94a3b8";
                  
                const statusBg = isActive
                  ? (job.status === "arrived" ? "var(--warning)" : "var(--tow-blue)")
                  : "#94a3b8";

                return `
                  <div class="job-card" style="border-color: ${borderColor}; ${!isActive ? 'min-width: 320px; flex-shrink: 0; margin-bottom: 0;' : ''}">
                  
                    <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:15px;">
                      <div>
                        ${!isActive ? `` : ''}
                        <div style="font-size:12px; font-weight:700; color:var(--muted); margin-top:2px;">${dist} miles away</div>
                      </div>
                      <span style="background: ${statusBg}; color:white; padding:4px 10px; border-radius:8px; font-size:10px; font-weight:800; text-transform:uppercase;">${job.status}</span>
                    </div>



                    ${imageBlock}

                    <div class="job-details-block">
                      <div class="job-detail-row">
                        <span class="job-detail-label">Vehicle Type</span>
                        <span class="job-detail-value">${job.vehicle || "N/A"}</span>
                      </div>
                      ${job.vehMake || job.vehModel ? `
                      <div class="job-detail-row">
                        <span class="job-detail-label">Make / Model</span>
                        <span class="job-detail-value">${job.vehYear || ""} ${job.vehMake || ""} ${job.vehModel || ""}</span>
                      </div>
                      <div class="job-detail-row">
                        <span class="job-detail-label">Color</span>
                        <span class="job-detail-value">${job.vehColor || "N/A"}</span>
                      </div>
                      <div class="job-detail-row">
                        <span class="job-detail-label">Plate</span>
                        <span class="job-detail-value" style="color:var(--tow-blue); font-family:monospace; letter-spacing:1px; font-size:14px;">${job.vehPlate || "N/A"}</span>
                      </div>` : ""}
                      <div class="job-detail-row">
                        <span class="job-detail-label">Issue</span>
                        <span class="job-detail-value">${job.issue || "N/A"}</span>
                      </div>
                      <div class="job-detail-row">
                        <span class="job-detail-label">Destination</span>
                        <span class="job-detail-value">${job.towDestination || "Not specified"}</span>
                      </div>
                    </div>
                `;
              };

              const active = jobs[0];
              let navLink = `https://maps.google.com/?q=$${active.lat},${active.lng}`;
              if (active.towDestination) navLink += `&destination_place_id=null&destination_address=${encodeURIComponent(active.towDestination)}`;

              let actionBtnHTML = "";
              if (active.status === "accepted") {
                actionBtnHTML = `<div class="action-btn primary" onclick="window.markStatus('${active.id}', 'arrived')">I'M HERE</div>`;
              } else if (active.status === "arrived") {
                actionBtnHTML = `<div class="action-btn done" onclick="window.markStatus('${active.id}', 'completed')">JOB DONE</div>`;
              }

              activeCard.innerHTML = generateCardContent(active, true) + `
                    <div class="action-grid">
                      <a href="tel:${active.phoneNumber || ""}" class="action-btn" style="${!active.phoneNumber ? "opacity:0.3; pointer-events:none;" : ""} ">
                          <img src="phone1.png" alt="Call" style="height:30px; width:auto;filter: drop-shadow(0 0 2px var(--accent)); ">
                      </a>
                      
                      <div class="action-btn" onclick="window.openChat('${active.id}_${active.ownerId}')">
                          <img src="Chaticon.png" alt="User Chat" style="height:30px; width:auto; filter: drop-shadow(0 0 2px var(--accent));">
                      </div>
                      <a href="${navLink}" target="_blank" class="action-btn">
                          <img src="navigate.png" alt="Navigate" style="height:30px; width:auto; filter:drop-shadow(0 0 2px var(--accent));">
                      </a>
                      ${actionBtnHTML}
                    </div>
                  </div>
              `;

              lineupCont.innerHTML = "";
              if (jobs.length === 1) {
                lineupCont.innerHTML = `<div style="font-size:12px; color:var(--muted); font-style:italic;">No upcoming jobs in queue.</div>`;
              } else {
                for (let i = 1; i < jobs.length; i++) {
                  lineupCont.innerHTML += generateCardContent(jobs[i], false) + `</div>`;
                }
              }
            }
      
      

      
      
      
      
      
      

      function renderMapMarkers(jobs) {
        jobMarkers.forEach((m) => m.setMap(null));
        jobMarkers = [];
        const bounds = new google.maps.LatLngBounds();
        if (userLocation) bounds.extend(userLocation);

        jobs.forEach((j, index) => {
          if (j.lat && j.lng) {
            const isFirst = index === 0;
            const marker = new google.maps.Marker({
              position: { lat: j.lat, lng: j.lng },
              map: map,
              icon: {
                path: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z",
                fillColor: isFirst ? "#2563eb" : "#94a3b8", // Blue for active, gray for lineup
                fillOpacity: 1,
                strokeWeight: 2,
                strokeColor: "#ffffff",
                scale: isFirst ? 1.5 : 1.2,
                anchor: new google.maps.Point(12, 12),
              },
            });
            jobMarkers.push(marker);
            bounds.extend({ lat: j.lat, lng: j.lng });
          }
        });
        if (jobs.length > 0 && userLocation) map.fitBounds(bounds);
      }

      // --- 4. ACTIONS ---
      window.markStatus = (id, newStatus) => {
        update(ref(db, `sosRequests/${id}`), { status: newStatus });
      };

      window.openChat = async (chatId) => {
        activeChatId = chatId;

        document.getElementById("chatModal").style.display = "flex";
        document.getElementById("hubModal").style.display = "none";

        // --- NEW: MARK MESSAGES AS READ ---
        const chatSnap = await get(ref(db, `chats/${activeChatId}`));
        if (chatSnap.exists()) {
          const messages = chatSnap.val();
          const updates = {};
          for (const msgId in messages) {
            if (
              messages[msgId].sender !== myDriverId &&
              messages[msgId].sender !== myShopId &&
              messages[msgId].read === false
            ) {
              updates[`chats/${activeChatId}/${msgId}/read`] = true;
            }
          }
          if (Object.keys(updates).length > 0) await update(ref(db), updates);
        }

        onValue(ref(db, `chats/${activeChatId}`), (snap) => {
          const box = document.getElementById("chatBox");
          box.innerHTML = "";
          const data = snap.val() || {};
          Object.values(data).forEach((m) => {
            const side =
              m.sender === myDriverId || m.sender === myShopId
                ? "msg-me"
                : "msg-them";
            box.innerHTML += `<div class="msg ${side}">${
              m.text || "Photo"
            }</div>`;
          });
          box.scrollTop = box.scrollHeight;
        });
      };

      window.toggleDashboard = () => {
        const dashboard = document.getElementById("dashboardView");
        dashboard.classList.toggle("dashboard-collapsed");
      };

      // --- NEW: MESSAGING HUB LOGIC ---
      window.openMessageHub = () => {
        const list = document.getElementById("hubThreadList");

        // Always show Dispatch as the first pinned thread
        list.innerHTML = `
                <div class="hub-thread" onclick="window.openChat('dispatch_' + myShopId)" style="background: #ffffff; border-bottom: 2px solid var(--accent);">
                  <div>
                    <div style="font-weight:900; font-size:15px; color:var(--accent);"> Dispatch Center</div>
                    <div style="font-size:12px; font-weight:700; color:var(--muted); margin-top:2px;">Main Office Chat</div>
                  </div>
                  <div style="color:var(--accent); font-weight:900; font-size:24px;">›</div>
                </div>
              `;

        if (window.currentJobsCache.length === 0) {
          list.innerHTML += `<div style="padding:30px; text-align:center; color:var(--muted); font-size:13px; font-weight:600;">No active job threads.</div>`;
        } else {
          window.currentJobsCache.forEach((job) => {
            list.innerHTML += `
                    <div class="hub-thread" onclick="window.openChat('${job.id}_${job.ownerId}')">
                      <div>
                        <div style="font-weight:900; font-size:15px; color:var(--text);">${job.vehicle}</div>
                        <div style="font-size:12px; font-weight:700; color:var(--success); margin-top:2px;">Active User Thread</div>
                      </div>
                      <div style="color:var(--muted); font-weight:900; font-size:24px;">›</div>
                    </div>
                  `;
          });
        }
        document.getElementById("hubModal").style.display = "flex";
      };

      // --- NEW: PROFILE LOGIC ---
      window.handleProfileImage = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const base64 = event.target.result;
          document.getElementById(
            "profileImagePreview"
          ).style.backgroundImage = `url(${base64})`;
          document.getElementById("profileImagePreview").innerHTML = "";
          localStorage.setItem("driverProfileImg", base64);
        };
        reader.readAsDataURL(file);
      };

      window.openDriverProfile = async () => {
        document.getElementById("profName").value =
          localStorage.getItem("driverName") || "";
        document.getElementById("profPin").value =
          localStorage.getItem("driverPin") || "";
        document.getElementById("profPhone").value =
          localStorage.getItem("driverPhone") || "";

        const img = localStorage.getItem("driverProfileImg");
        if (img) {
          document.getElementById(
            "profileImagePreview"
          ).style.backgroundImage = `url(${img})`;
          document.getElementById("profileImagePreview").innerHTML = "";
        } else {
          document.getElementById("profileImagePreview").style.backgroundImage =
            "none";
          document.getElementById("profileImagePreview").innerHTML = "+";
        }

        const snap = await get(ref(db, `driverDetails/${myDriverId}`));
        if (snap.exists()) {
          const data = snap.val();
          if (data.phone)
            document.getElementById("profPhone").value = data.phone;
          if (data.empId)
            document.getElementById("profEmpId").value = data.empId;
          if (data.profileImage) {
            localStorage.setItem("driverProfileImg", data.profileImage);
            document.getElementById(
              "profileImagePreview"
            ).style.backgroundImage = `url(${data.profileImage})`;
            document.getElementById("profileImagePreview").innerHTML = "";
          }
        }
        document.getElementById("profileModal").style.display = "flex";
      };

      window.saveDriverProfile = () => {
        const phone = document.getElementById("profPhone").value;
        const empId = document.getElementById("profEmpId").value;
        const img = localStorage.getItem("driverProfileImg") || "";

        update(ref(db, `driverDetails/${myDriverId}`), {
          phone,
          empId,
          profileImage: img,
        });
        localStorage.setItem("driverPhone", phone);
        document.getElementById("profileModal").style.display = "none";
      };

      // --- NEW: BACKGROUND CHAT LISTENER ---
      function listenToChats() {
        onValue(ref(db, "chats"), (snap) => {
          const data = snap.val() || {};
          let unreadCount = 0;
          let latestTime = 0;

          Object.keys(data).forEach((chatId) => {
            let isMyChat = false;
            if (chatId === `dispatch_${myShopId}`) isMyChat = true;
            else {
              window.currentJobsCache.forEach((job) => {
                if (chatId === `${job.id}_${job.ownerId}`) isMyChat = true;
              });
            }

            if (isMyChat) {
              const msgs = Object.values(data[chatId]);
              msgs.forEach((m) => {
                if (
                  m.sender !== myDriverId &&
                  m.sender !== myShopId &&
                  m.read === false
                ) {
                  unreadCount++;
                }
                if (m.timestamp > latestTime) latestTime = m.timestamp;
              });
            }
          });

          const badge = document.getElementById("hubBadge");
          if (badge) {
            badge.innerText = unreadCount;
            badge.style.display = unreadCount > 0 ? "flex" : "none";
          }

          if (
            latestTime > lastChatTimestamp &&
            lastChatTimestamp !== 0 &&
            unreadCount > 0
          ) {
            const sound = document.getElementById("notificationSound");
            if (sound) sound.play().catch((e) => {});
          }
          lastChatTimestamp = latestTime;
        });
      }

      window.sendTextMsg = () => {
        const input = document.getElementById("chatInput");
        if (!input.value.trim() || !activeChatId) return;
        push(ref(db, `chats/${activeChatId}`), {
          sender: myDriverId,
          text: input.value,
          timestamp: Date.now(),
          read: false,
        });
        input.value = "";
      };
    </script>
  </body>
</html>
