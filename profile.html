



<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /> 
    <meta 
      name="viewport"   
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pro Directory</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>  
    
    
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

 
    <style> 
      :root { 
        --bg-primary: #f8fafc; 
        --bg-card: #ffffff; 
        --accent: #ee611c; 
        --text-dark: #0f172a;   
        --text-muted: #64748b;    
      } 
  
      * {  
        box-sizing: border-box; 
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        background: var(--bg-primary);
        color: var(--text-dark); 
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* --- NETFLIX FEED STYLES --- */
      .feed-container {
        padding: 20px 0 100px 0;
      }
      .category-row { 
        margin-bottom: 30px;
      }
      .category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        margin-bottom: 12px;
      }
      .category-title {
        font-size: 18px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .see-all-btn {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        cursor: pointer;
        text-transform: uppercase;
      }

      .horizontal-lane {
        display: flex;
        overflow-x: auto;
        gap: 15px;
        padding: 0 20px 10px 20px;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .horizontal-lane::-webkit-scrollbar {
        display: none;
      }

      .pro-card {
        position: relative;
        min-width: 260px;
        height: 160px;
        border-radius: 16px;
        overflow: hidden;
        scroll-snap-align: start;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        background: #e2e8f0;
      }
      .pro-card-bg {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }
      .pro-card:active .pro-card-bg {
        transform: scale(1.05);
      }

      .pro-card-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
        padding: 15px;
        display: flex;
        align-items: flex-end;
        gap: 12px;
      }
      .pro-avatar {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        object-fit: cover;
        background: #fff;
      }
      .pro-info {
        color: white;
      }
      .pro-name {
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 2px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      .pro-rating {
        font-size: 12px;
        font-weight: 600;
        color: #fde047;
      }

      /* --- 95x95 PROFILE MODAL STYLES --- */
      #profileModal {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(5px);
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .modal-content {
        width: 95vw;
        height: 95vh;
        max-width: 500px;
        background: var(--bg-card);
        border-radius: 20px;
        position: relative;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      .modal-header-img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        background: #e2e8f0;
      }
      .close-modal-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: var(--accent);
        color: white;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        z-index: 10;
        backdrop-filter: blur(4px);
      }

      .modal-identity {
        display: flex;
        gap: 15px;
        padding: 0 20px;
        transform: translateY(-30px);
        margin-bottom: -15px;
      }
      .modal-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 4px solid var(--bg-card);
        object-fit: cover;
        background: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .modal-title-block {
        padding-top: 35px;
      }
      .modal-name {
        font-size: 20px;
        font-weight: 900;
        color: var(--text-dark);
      }

      .modal-section {
        padding: 20px;
        border-bottom: 1px solid #f1f5f9;
      }
      .modal-section h3 {
        font-size: 14px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
      }
      .modal-text {
        font-size: 14px;
        line-height: 1.5;
        font-weight: 500;
      }

      .action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 20px;
        background: #f8fafc;
        margin-top: auto;
      }
      .btn {
        padding: 16px;
        border-radius: 12px;
        font-weight: 800;
        font-size: 14px;
        text-align: center;
        border: none;
        cursor: pointer;
        color: white;
        text-transform: uppercase;
      }
      .btn-call {
        background: #1e293b;
      }
      .btn-book {
        background: var(--accent);
      }

      /* Universal Upsell Bar */
      .upsell-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #1e293b;
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 500;
      }
      .upsell-footer span {
        color: var(--accent);
        font-weight: 800;
      }
      
      
      
      
      
            .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 10px;
      }
      .gallery-img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 8px;
        cursor: pointer;
      }
      .image-viewer {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.95);
        z-index: 20000;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .image-viewer img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      
      .close-viewer {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 40px; 
        height: 40px;
        background: var(--accent);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
        border: none;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        z-index: 20001;
      }
      
      
      
      
      
      
      .close-viewer {
        position: absolute;
        top: 20px;
        right: 20px;
        color: var(--accent);
        font-size: 30px;
        font-weight: bold;
        cursor: pointer;
        background: none;
        border: none;
      }
      .booking-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.9);
        z-index: 15000;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .booking-box {
        background: var(--bg-card);
        padding: 20px;
        border-radius: 16px;
        width: 90vw;
        max-width: 400px;
      }
      .booking-box input, .booking-box textarea {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }

      
      
      
      
      
      
      
      
      
      
      .horizontal-lane.expanded {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 15px;
        overflow-x: visible;
        padding: 0 20px 20px 20px;
        scroll-snap-type: none;
      }
      
      
      
      
    </style>
  </head>
  <body>
    <div
      style="
        padding: 0 20px 20px 20px;
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg-primary);
      "
    >
      <input
        type="text"
        id="searchInput"
        placeholder="Search pros or categories..."
        style="
          width: 100%;
          padding: 12px 16px;
          border-radius: 12px;
          border: 1px solid #e2e8f0;
          font-size: 15px;
          background: #fff;
        "
      />
    </div>

    <div class="feed-container" id="feedContainer"></div>

    <div id="profileModal">
      <div class="modal-content">
        <button class="close-modal-btn" onclick="closeModal()">✕</button>
        <img id="modalCover" src="" class="modal-header-img" />

        <div class="modal-identity">
          <img id="modalAvatar" src="" class="modal-avatar" />
          <div class="modal-title-block">
            <div class="modal-name" id="modalName">Shop Name</div>
            <div class="pro-rating">
               <span id="modalRating"></span> <span id="modalReviews"
                ></span
              >
              
            </div>
          </div>
        </div>

        
        
        
        <div id="reviewInputBox" style="display: none; flex-direction: column; align-items: center; background: #f8fafc; padding: 15px; border-top: 1px solid #f1f5f9; margin-bottom: 10px;">
          <div style="font-size: 13px; font-weight: 800; color: var(--text-dark); margin-bottom: 8px;">Rate this Pro</div>
          <div id="starSelector" style="font-size: 32px; color: #cbd5e1; cursor: pointer; margin-bottom: 15px; user-select: none; display: flex; gap: 5px;">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
          </div>
          <button onclick="submitReview()" class="btn btn-book" style="padding: 10px 20px; font-size: 13px; width: 100%; border-radius: 8px;">Save Review</button>
        </div>
        
        
        
        
        <div class="modal-section">
          <h3>About the Pro</h3>
          <div class="modal-text" id="modalDesc">Loading description...</div>
        </div>

        <div class="modal-section">
          <h3>Business Info</h3>
          <div class="modal-text">
            <strong>Address:</strong> <span id="modalAddress">...</span>
          </div>
          <div class="modal-text" style="margin-top: 8px">
            <strong>Status:</strong>
            <span style="color: #10b981">Available Now</span>
          </div>
        </div>
        
        
        <div class="modal-section" id="gallerySection">
          <h3>Gallery</h3>
          <div class="gallery-grid" id="modalGallery"></div>
        </div>
        
        
        
     
        <div class="action-grid">
          <a id="callProBtn" href="#" class="btn btn-call" style="text-decoration:none;">Call Now</a>
          <button class="btn btn-book" onclick="openBooking()">Book Service</button>
        </div>
      </div>
    </div>

    <div class="image-viewer" id="imageViewer">
      <button class="close-viewer" onclick="closeViewer()">✕</button>
      <img id="viewerImg" src="" />
    </div>

    <div class="booking-modal-overlay" id="bookingModal">
      <div class="booking-box">
        <h3 style="margin-bottom:10px;">Request Appointment</h3>
        
        <input type="text" id="bookName" placeholder="Your Name">
        <input type="text" id="bookContact" placeholder="Phone Number or Email">
        
        <div style="display: flex; gap: 10px;">
          <input type="date" id="bookDate" style="flex: 1; margin: 10px 0;">
          <input type="time" id="bookTime" style="flex: 1; margin: 10px 0;">
        </div>
        
        <textarea id="bookDesc" rows="4" placeholder="Describe the issue..."></textarea>
        
        
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button class="btn btn-call" onclick="closeBooking()" style="flex:1;">Cancel</button>
          <button class="btn btn-book" onclick="submitBooking()" style="flex:1;">Send Request</button>
        </div>
      </div>
    </div>

        
        
        
        
        
        
        
  
    <script>
      
        const firebaseConfig = {
        apiKey: "AIzaSyBgXWZkH0WMjhGmOfxjqbIDoJHlyA1pc-o",
        authDomain: "roadsidehero-104ea.firebaseapp.com",
        databaseURL: "https://roadsidehero-104ea-default-rtdb.firebaseio.com",
        projectId: "roadsidehero-104ea",
        storageBucket: "roadsidehero-104ea.firebasestorage.app",
        };
        firebase.initializeApp(firebaseConfig);
      
        
        let prosData = []; 
      
      
      
      
      
        function renderFeed() {
            const feedContainer = document.getElementById('feedContainer'); 
            
            // Real-time Firestore listener
            firebase.firestore().collection('pros').onSnapshot((snapshot) => {
                feedContainer.innerHTML = ''; // Clear existing feed on update
                prosData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              
                const standardCategories = ["Towing", "Mechanic", "Detailing", "Tires", "Locksmith", "Tint", "Glass", "Battery", "Wraps", "Bodywork", "Audio", "Upholstery", "Alignment", "Oil", "Transmission", "Miscellaneous" ];
                const dbCategories = prosData.map(p => p.category);
              
          const categories = [...new Set([...standardCategories, ...dbCategories])].filter(Boolean);   
                categories.forEach(category => {
                    const prosInCategory = prosData.filter(p => p.category === category);
                    const rowHTML = `
                        <div class="category-row">
                        <div class="category-header">
                                <div class="category-title">${category}</div>
                                <div class="see-all-btn" onclick="toggleExpand(this)">See All</div>
                            </div>
                            <div class="horizontal-lane" id="lane-${category.replace(/\s+/g, '-')}">

                                ${prosInCategory.length === 0 ? getAddBusinessCard(category) : ''}
                                ${prosInCategory.map(pro => `
         
                                    <div class="pro-card" onclick="openModal('${pro.id}')">
                                        <img class="pro-card-bg" src="${pro.cover}" alt="${pro.name}">
                                        <div class="pro-card-overlay">
                                            <img class="pro-avatar" src="${pro.avatar}">
                                            <div class="pro-info">
                                                <div class="pro-name">${pro.name}</div>
                                                
                                                <div class="pro-rating">
                                                    ${(!pro.reviews || parseInt(pro.reviews) === 0) 
                                                        ? '<span style="color:#cbd5e1; font-weight:500;">No reviews available</span>' 
                                                        : `★ ${pro.rating} (${pro.reviews})`}
                                                </div>
                                                
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    feedContainer.innerHTML += rowHTML;
                });
            });
        }

      
      
      
      async function openModal(proId) {
        try {
          const doc = await firebase.firestore().collection('pros').doc(proId).get();
          if (doc.exists) {
            const pro = { id: doc.id, ...doc.data() };
            
            document.getElementById("modalCover").src = pro.cover || "";
            document.getElementById("modalAvatar").src = pro.avatar || "";
            document.getElementById("modalName").innerText = pro.name || "Shop Name";
            
            
            
            let ratingEl = document.querySelector('#profileModal .pro-rating');
            const addReviewLink = `<span style="color:var(--accent); font-size:8px;
            font-weight:800; cursor:pointer; margin-left:5px;" onclick="document.getElementById('reviewInputBox')
            .style.display='flex'">+ Add Review</span>`;
            
            if (!pro.reviews || parseInt(pro.reviews) === 0) {
              ratingEl.innerHTML = `<span style="color:var(--text-muted); font-size:12px;">No reviews available</span> ${addReviewLink}`;
            } else {
              ratingEl.innerHTML = `★ <span id="modalRating">${pro.rating || "0"}</span> (<span id="modalReviews">${pro.reviews}</span> Reviews) ${addReviewLink}`;
            }
            
   
  
            if (pro.phone) {
              document.getElementById("callProBtn").href = `tel:${pro.phone}`;
            }
            
      
            
            const gallerySec = document.getElementById("gallerySection");
            const galleryGrid = document.getElementById("modalGallery");
            
            // Ensure the section remains structurally visible
            gallerySec.style.display = "block";
            
            if (pro.gallery && pro.gallery.length > 0) {
              // Render the grid of cropped thumbnails
              galleryGrid.style.display = "grid";
              galleryGrid.innerHTML = pro.gallery.map(url => `<img src="${url}" class="gallery-img" onclick="viewImage('${url}')">`).join('');
            } else {
              // Display the clean placeholder when no images are present
              galleryGrid.style.display = "block";
              galleryGrid.innerHTML = `<div style="width: 100%; padding: 30px; background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 12px; text-align: center; color: var(--text-muted); font-weight: 600; font-size: 13px;">No images added</div>`;
            }
     
  
            window.currentProId = pro.id;

            
            document.getElementById("modalDesc").innerText = pro.desc || "Loading...";
            document.getElementById("modalAddress").innerText = pro.address || "...";

            document.getElementById("profileModal").style.display = "flex";
          }
        } catch (error) {
          console.error("Error fetching pro details:", error);
        }
      }
      
      



      function closeModal() {
        document.getElementById("profileModal").style.display = "none";
      }
 
       
      
      
     
      let currentSelectedStars = 0;

      function setStars(num) {
        currentSelectedStars = num;
        const starContainer = document.getElementById("starSelector");
        const stars = starContainer.querySelectorAll("span");
        stars.forEach((star, index) => {
          star.style.color = index < num ? "#fde047" : "#cbd5e1";
        });
      }

      async function submitReview() {
        if (currentSelectedStars === 0) return alert("Please select a star rating.");
        
        const btn = document.querySelector("#reviewInputBox button");
        btn.innerText = "Saving...";
        btn.disabled = true;

        try {
          const proRef = firebase.firestore().collection('pros').doc(window.currentProId);
          const docSnap = await proRef.get();
          
          if (docSnap.exists) {
            const data = docSnap.data();
            const currentReviews = parseInt(data.reviews) || 0;
            const currentRating = parseFloat(data.rating) || 0;
            
            const newReviews = currentReviews + 1;
            const newRating = ((currentRating * currentReviews) + currentSelectedStars) / newReviews;
            const formattedRating = newRating.toFixed(1);

            await proRef.update({
              rating: formattedRating,
              reviews: newReviews.toString()
            });

            const ratingEl = document.querySelector('#profileModal .pro-rating');
            ratingEl.innerHTML = `★ <span id="modalRating">${formattedRating}</span> (<span id="modalReviews">${newReviews}</span> Reviews) <span style="color:#10b981; font-size:12px; font-weight:800; margin-left:8px;">✓ Saved</span>`;
            
            document.getElementById('reviewInputBox').style.display = 'none';
            currentSelectedStars = 0;
            setStars(0);
          }
        } catch (e) {
          console.error(e);
          alert("Error saving review. Please try again.");
        } finally {
          btn.innerText = "Save Review";
          btn.disabled = false;
        }
      }
      
      
      
      
      
      
      
      function viewImage(url) {
        document.getElementById('viewerImg').src = url;
        document.getElementById('imageViewer').style.display = 'flex';
      }
      function closeViewer() {
        document.getElementById('imageViewer').style.display = 'none';
      }
      function openBooking() {
        document.getElementById('bookingModal').style.display = 'flex';
      }
      function closeBooking() {
        document.getElementById('bookingModal').style.display = 'none';
      }
      
      
      async function submitBooking() {
        const name = document.getElementById('bookName').value;
        const contact = document.getElementById('bookContact').value;
        const date = document.getElementById('bookDate').value;
        const time = document.getElementById('bookTime').value;
        const desc = document.getElementById('bookDesc').value;
        
        if(!name || !contact || !date || !time || !desc) {
          alert('Please fill out all the details');
          return;
        }

        const btn = document.querySelector('#bookingModal .btn-book');
        const origText = btn.innerText;
        btn.innerText = 'SENDING...';
        btn.disabled = true;
        
        try {
          await firebase.firestore().collection('appointments').add({
            proId: window.currentProId,
            seekerId: firebase.auth().currentUser ? firebase.auth().currentUser.uid : null,
            
            seekerName: name,
            seekerContact: contact,
            date: date,
            time: time,
            description: desc,
            status: 'pending',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          
          await firebase.firestore().collection('notifications').add({
            recipientId: window.currentProId,
            message: `You received a new appointment request from ${name}!`,
            type: 'new_appointment',
            read: false,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          
          
          
          
          alert('Appointment requested successfully!');
          closeBooking();
        } catch (e) {
          console.error(e);
          alert('Error sending request.');
        } finally {
          btn.innerText = origText;
          btn.disabled = false;
        }
      }

      
      
      
      
      
      
      
      function toggleExpand(btn) {
        const lane = btn.parentElement.nextElementSibling;
        lane.classList.toggle('expanded');
        btn.innerText = lane.classList.contains('expanded') ? 'Show Less' : 'See All';
      }
      
      
      
      
      
       
      
      
      
      
      // Cross-Communication: Triggers the Gatekeeper login in index.html
      function triggerParentLogin() {
        window.parent.postMessage("OPEN_PRO_LOGIN", "*");
      }
      
      
      
      // Initialize Feed & Public View Mode Router
      document.addEventListener("DOMContentLoaded", async () => {
          renderFeed();
          
          // Check the URL for a specific Hero ID
          const urlParams = new URLSearchParams(window.location.search);
          const targetUserId = urlParams.get('userId');
          
          if (targetUserId) {
              // If an ID exists, instantly pull their data and slide the profile open
              openModal(targetUserId);
          }
      });
      
      
      

 
      
      
      

function getAddBusinessCard(category) {
        return `
            <div class="pro-card" onclick="triggerParentLogin()" style="border: 2px dashed #cbd5e1; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
                <div style="color: #64748b; font-weight: 800; font-size: 14px; padding: 20px;">
                    + Add Your Business<br>to ${category}
                </div>
            </div>
        `;
      } 

      document
        .getElementById("searchInput")
        .addEventListener("input", function (e) {
          const query = e.target.value.toLowerCase();
          const rows = document.querySelectorAll(".category-row");

          rows.forEach((row) => {
            const categoryName = row
              .querySelector(".category-title")
              .innerText.toLowerCase();
            const pros = row.querySelectorAll(".pro-name");
            let found = categoryName.includes(query);

            pros.forEach((pro) => {
              if (pro.innerText.toLowerCase().includes(query)) found = true;
            });

            row.style.display = found ? "block" : "none";
          });
        });






let scrollStopTimer;
      window.addEventListener("scroll", () => {
        // Clear the timer while they are actively moving the page
        clearTimeout(scrollStopTimer);
        
        // Wait 150 milliseconds after movement stops to confirm the scroll is finished
        scrollStopTimer = setTimeout(() => {
          // 1. Flash the ribbon ON
          window.parent.postMessage({ action: 'START_GLOBAL_LOADING' }, '*');
          
          // 2. Turn it OFF a split second later (500 milliseconds)
          setTimeout(() => {
            window.parent.postMessage({ action: 'STOP_GLOBAL_LOADING' }, '*');
          }, 500); 
          
        }, 150);
      });

      
    </script>
  </body>
</html>
