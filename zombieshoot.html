<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PlaygroundX | Zombie Survival (Bright)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; -webkit-user-select: none; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; z-index: 10;
        }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            background: transparent; transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #0f0; opacity: 0.8; }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        #hud-top { padding: 20px; display: flex; justify-content: space-between; color: #0f0; font-size: 20px; font-weight: bold; text-shadow: 0 0 5px #0f0; }
        #hud-bottom { padding: 20px; text-align: center; color: #fff; font-size: 14px; opacity: 0.7; }
        
        /* CONTROLS */
        .joystick-zone {
            position: absolute; bottom: 40px; width: 120px; height: 120px;
            pointer-events: auto; display: none;
            border: 2px solid rgba(255,255,255,0.2); border-radius: 50%;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(4px);
            touch-action: none;
        }
        #stick-left { left: 30px; }
        #stick-right { right: 30px; }
        
        .knob {
            width: 50px; height: 50px; background: rgba(255,255,255,0.8);
            border-radius: 50%; position: absolute; top: 35px; left: 35px; pointer-events: none;
        }

        #btn-fire {
            position: absolute; bottom: 180px; right: 30px; width: 80px; height: 80px;
            background: rgba(255, 0, 0, 0.4); border: 2px solid #ff0000; border-radius: 50%;
            pointer-events: auto; display: none; color: white; font-weight: bold; font-size: 18px;
            align-items: center; justify-content: center;
        }
        #btn-fire:active { background: rgba(255, 0, 0, 0.8); }

        #blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: auto; z-index: 999;
        }
        #instructions { color: #fff; text-align: center; cursor: pointer; padding: 20px; }
        h1 { font-size: 40px; color: #d00; margin: 0; text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 20px #d00; }
        p { font-size: 18px; line-height: 1.5; }

        #damage-flash {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: red; opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 5;
        }

        @media (hover: none) and (pointer: coarse) {
            .joystick-zone { display: block; }
            #btn-fire { display: flex; }
            #hud-bottom { display: none; }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="damage-flash"></div>

    <div id="ui-layer">
        <div id="hud-top">
            <div id="score-disp">KILLS: 0</div>
            <div id="health-disp">HP: 100%</div>
        </div>
        <div id="crosshair"></div>
        <div id="hud-bottom">WASD to Move | CLICK to Shoot</div>
        <div id="stick-left" class="joystick-zone"><div class="knob"></div></div>
        <div id="stick-right" class="joystick-zone"><div class="knob"></div></div>
        <div id="btn-fire">FIRE</div>
    </div>

    <div id="blocker">
        <div id="instructions">
            <h1>Zombie Siege</h1>
            <p>Tap to Start</p>
            <p style="font-size:14px; color:#888; margin-top:20px;">Use Joysticks (Mobile) or WASD (PC)</p>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let score = 0, health = 100, isGameOver = false;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const zombies = []; 
        const input = { move: { x: 0, y: 0 }, look: { x: 0, y: 0 } };

        const scene = new THREE.Scene();
        // LIGHTER FOG (Moonlit Blue-Grey instead of black)
        const fogColor = 0x202030; 
        scene.background = new THREE.Color(fogColor);
        scene.fog = new THREE.Fog(fogColor, 15, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6; camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Brighten the tone mapping
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        document.body.appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => {
            if(!isGameOver) {
                if(isMobile) {
                    blocker.style.display = 'none';
                    document.getElementById('stick-left').style.display = 'block';
                    document.getElementById('stick-right').style.display = 'block';
                    document.getElementById('btn-fire').style.display = 'flex';
                } else controls.lock();
            } else location.reload();
        });
        
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => { if(!isGameOver && !isMobile) blocker.style.display = 'flex'; });

        // --- JOYSTICKS ---
        function setupJoystick(id, key) {
            const zone = document.getElementById(id);
            const knob = zone.querySelector('.knob');
            let rect, radius, center, touchId = null;

            zone.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.changedTouches[0];
                touchId = t.identifier;
                rect = zone.getBoundingClientRect(); radius = rect.width/2;
                center = { x: rect.left+radius, y: rect.top+radius };
                handleMove(t);
            }, {passive:false});

            zone.addEventListener('touchmove', e => {
                e.preventDefault();
                for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === touchId) handleMove(e.changedTouches[i]);
            }, {passive:false});

            const end = e => { e.preventDefault(); touchId = null; input[key].x=0; input[key].y=0; knob.style.transform = `translate(0,0)`; };
            zone.addEventListener('touchend', end); zone.addEventListener('touchcancel', end);

            function handleMove(t) {
                let dx = t.clientX - center.x, dy = t.clientY - center.y;
                const dist = Math.sqrt(dx*dx + dy*dy), max = radius - 25;
                if(dist > max) { const r = max/dist; dx*=r; dy*=r; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                input[key].x = dx/max; input[key].y = dy/max;
            }
        }
        if(isMobile) {
            setupJoystick('stick-left', 'move'); setupJoystick('stick-right', 'look');
            document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); tryShoot(); });
        }

        // --- IMPROVED LIGHTING ---
        // 1. Ambient Light (General brightness)
        const ambient = new THREE.AmbientLight(0x606080, 0.8); // Blue-ish ambient
        scene.add(ambient);
        
        // 2. Moonlight (Directional shadows)
        const moonLight = new THREE.DirectionalLight(0xaaccff, 0.5);
        moonLight.position.set(-20, 50, -20);
        moonLight.castShadow = true;
        scene.add(moonLight);
        
        // 3. High-Power Flashlight
        const flashLight = new THREE.SpotLight(0xffffee, 6.0); // High intensity
        flashLight.angle = 0.6; // Wider beam
        flashLight.penumbra = 0.3; // Softer edges
        flashLight.decay = 1.5; // Light travels further
        flashLight.distance = 70; 
        camera.add(flashLight);
        flashLight.target.position.set(0, 0, -1);
        camera.add(flashLight.target);
        scene.add(camera);

        // --- WEAPON & WORLD ---
        function createFPSRifle() {
            const g = new THREE.Group();
            const m = new THREE.MeshStandardMaterial({color:0x222222, roughness:0.4});
            const w = new THREE.MeshStandardMaterial({color:0x664433, roughness:0.8});
            g.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.8), m));
            const b = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.9), m);
            b.rotation.x = Math.PI/2; b.position.set(0, 0.05, -0.6); g.add(b);
            const s = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.2, 0.4), w);
            s.position.z = 0.5; g.add(s);
            const f = new THREE.PointLight(0xffaa00, 0, 5);
            f.position.set(0, 0.05, -1.1); g.add(f); g.userData.flash = f;
            return g;
        }
        const rifle = createFPSRifle(); rifle.position.set(0.3, -0.4, -0.5); camera.add(rifle);

        // Brighter Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 200), new THREE.MeshStandardMaterial({color:0x333333, roughness:0.9}));
        floor.rotation.x = -Math.PI/2; scene.add(floor);

        const boxGeo = new THREE.BoxGeometry(1,1,1);
        const wallMat = new THREE.MeshStandardMaterial({color:0x222222});
        for(let i=0; i<40; i++) {
            const h = 5 + Math.random()*15, b = new THREE.Mesh(boxGeo, wallMat);
            b.scale.set(5+Math.random()*5, h, 5+Math.random()*5);
            b.position.set((Math.random()-0.5)*80, h/2, (Math.random()-0.5)*180);
            scene.add(b);
        }

        function createZombieMesh() {
            const g = new THREE.Group();
            // Lighter skin so they are visible in dark
            const skin = new THREE.MeshStandardMaterial({color: 0x778866}); 
            const shirt = new THREE.MeshStandardMaterial({color: 0x554444});
            
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), skin); head.position.y=1.6;
            const eyes = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 0.02), new THREE.MeshBasicMaterial({color:0xff3300}));
            eyes.position.set(0, 0, 0.21); head.add(eyes); g.add(head);

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.25), shirt); body.position.y=1.0; g.add(body);
            const limb = new THREE.BoxGeometry(0.12, 0.6, 0.12); limb.translate(0, -0.25, 0);
            const lA = new THREE.Mesh(limb, skin); lA.position.set(-0.35, 1.3, 0); lA.rotation.x = -1.4; g.add(lA);
            const rA = new THREE.Mesh(limb, skin); rA.position.set(0.35, 1.3, 0); rA.rotation.x = -1.4; g.add(rA);
            const lL = new THREE.Mesh(limb, shirt); lL.position.set(-0.15, 0.6, 0); g.add(lL);
            const rL = new THREE.Mesh(limb, shirt); rL.position.set(0.15, 0.6, 0); g.add(rL);

            const hit = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), new THREE.MeshBasicMaterial({visible:false}));
            hit.position.y=0.9; hit.userData.parentGroup = g; g.add(hit);
            g.userData.hitbox = hit; g.userData.health = 2;
            return g;
        }

        let lastSpawn = 0;
        function spawnZombie() {
            if(isGameOver) return;
            const z = createZombieMesh();
            const angle = Math.random()*Math.PI*2, dist = 30+Math.random()*20;
            z.position.set(camera.position.x+Math.sin(angle)*dist, 0, camera.position.z+Math.cos(angle)*dist);
            scene.add(z); zombies.push(z);
        }

        const raycaster = new THREE.Raycaster();
        function tryShoot() {
            if(isGameOver) return;
            rifle.position.z += 0.15; rifle.rotation.x += 0.2;
            rifle.userData.flash.intensity = 10;
            setTimeout(() => rifle.userData.flash.intensity = 0, 50);

            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(zombies.map(z => z.userData.hitbox));
            
            if(hits.length > 0) {
                const grp = hits[0].object.userData.parentGroup;
                grp.userData.health--;
                grp.position.add(raycaster.ray.direction.multiplyScalar(0.8));
                
                hits[0].object.material.visible = true;
                hits[0].object.material.color.set(0xff0000);
                hits[0].object.material.opacity = 0.5; hits[0].object.material.transparent = true;
                setTimeout(() => hits[0].object.material.visible = false, 100);

                if(grp.userData.health <= 0) killZombie(grp);
            }
        }
        window.addEventListener('mousedown', () => { if(controls.isLocked) tryShoot(); });

        function killZombie(z) {
            if(z.userData.dead) return;
            z.userData.dead = true;
            score++; document.getElementById('score-disp').innerText = `KILLS: ${score}`;
            const idx = zombies.indexOf(z); if(idx > -1) zombies.splice(idx, 1);
            let fall = setInterval(() => {
                z.rotation.x -= 0.1; z.position.y -= 0.05;
                if(z.rotation.x < -1.5) { clearInterval(fall); scene.remove(z); }
            }, 30);
        }

        function takeDamage() {
            health -= 5; document.getElementById('health-disp').innerText = `HP: ${health}%`;
            document.getElementById('damage-flash').style.opacity = 0.8;
            setTimeout(() => document.getElementById('damage-flash').style.opacity = 0, 200);
            if(health <= 0) {
                isGameOver = true;
                if(!isMobile) controls.unlock();
                blocker.style.display = 'flex';
                document.querySelector('h1').innerText = "YOU DIED";
                document.querySelector('p').innerText = `Score: ${score}`;
            }
        }

        const clock = new THREE.Clock();
        const velocity = new THREE.Vector3();
        const keys = { w:0, a:0, s:0, d:0 };
        document.addEventListener('keydown', e => { if(e.code=='KeyW') keys.w=1; if(e.code=='KeyS') keys.s=1; if(e.code=='KeyA') keys.a=1; if(e.code=='KeyD') keys.d=1; });
        document.addEventListener('keyup', e => { if(e.code=='KeyW') keys.w=0; if(e.code=='KeyS') keys.s=0; if(e.code=='KeyA') keys.a=0; if(e.code=='KeyD') keys.d=0; });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta(), time = Date.now();

            if(!isGameOver && (controls.isLocked || isMobile)) {
                let moveX = 0, moveZ = 0;
                
                if(isMobile) {
                    moveX = input.move.x; moveZ = input.move.y;
                    const sens = 2.0 * delta;
                    camera.rotation.y -= input.look.x * sens;
                    camera.rotation.x -= input.look.y * sens;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                } else {
                    moveZ = keys.w - keys.s; moveX = keys.d - keys.a;
                }

                if (isMobile) {
                    const speed = 10.0 * delta;
                    if(moveZ !== 0 || moveX !== 0) {
                        const fw = new THREE.Vector3(); camera.getWorldDirection(fw); fw.y=0; fw.normalize();
                        const rt = new THREE.Vector3(); camera.getWorldDirection(rt); rt.y=0; rt.normalize(); rt.cross(camera.up);
                        camera.position.addScaledVector(fw, -moveZ * speed);
                        camera.position.addScaledVector(rt, moveX * speed);
                    }
                } else {
                    const speed = 40.0 * delta;
                    velocity.x -= velocity.x * 10.0 * delta; velocity.z -= velocity.z * 10.0 * delta;
                    if(moveZ) velocity.z -= moveZ * speed; if(moveX) velocity.x -= moveX * speed;
                    controls.moveRight(-velocity.x * delta); controls.moveForward(velocity.z * delta);
                }

                rifle.position.z = THREE.MathUtils.lerp(rifle.position.z, -0.5, 0.1);
                rifle.rotation.x = THREE.MathUtils.lerp(rifle.rotation.x, 0, 0.1);
                if(moveX!==0||moveZ!==0) {
                     rifle.position.y = -0.4 + Math.sin(time*0.015)*0.01;
                     rifle.position.x = 0.3 + Math.cos(time*0.015)*0.01;
                }

                if(time - lastSpawn > 2000) { lastSpawn = time; spawnZombie(); }
                zombies.forEach(z => {
                    if(z.userData.dead) return;
                    z.lookAt(camera.position.x, 0, camera.position.z);
                    z.translateZ(3.5 * delta);
                    z.children.forEach(c => { if(c.geometry && c.position.y < 0.8) c.rotation.x = Math.sin(time*0.01)*0.5; });
                    if(z.position.distanceTo(camera.position) < 1.5) { takeDamage(); z.translateZ(-3.0); }
                });
            }
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
